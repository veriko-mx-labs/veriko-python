[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "veriko"
version = "0.8.0"
description = "Official Veriko SDK: validates SPEI transfers against the Banxico CEP"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Veriko", email = "soporte@veriko.mx" }]
keywords = ["cep", "spei", "banxico", "veriko", "mexico", "payments", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://veriko.mx"
Documentation = "https://docs.veriko.mx/en/"
Issues = "https://github.com/veriko-mx-labs/veriko-python/issues"
Source = "https://github.com/veriko-mx-labs/veriko-python"
Changelog = "https://github.com/veriko-mx-labs/veriko-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "mypy>=1.8",
  "pytest>=7.4",
  "pyyaml>=6",
  "ruff>=0.6",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0.12.20261103",
]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/veriko"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true

# Los ejemplos son para leer y copiar, no para tipar: importan frameworks que el
# SDK no depende de tener instalados. El CI los revisa con ruff y los compila.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
