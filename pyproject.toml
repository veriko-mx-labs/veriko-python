[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "veriko"
version = "0.3.0"
description = "SDK oficial de Veriko: valida transferencias SPEI contra el CEP de Banxico"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Veriko", email = "soporte@veriko.mx" }]
keywords = ["cep", "spei", "banxico", "veriko", "mexico", "payments", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://veriko.mx"
Documentation = "https://docs.veriko.mx"
Source = "https://github.com/veriko-mx-labs/veriko-python"
Changelog = "https://github.com/veriko-mx-labs/veriko-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/veriko"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true

# Los ejemplos son para leer y copiar, no para tipar: importan frameworks que el
# SDK no depende de tener instalados. El CI los revisa con ruff y los compila.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
