name: Sincronizar el spec público

on:
  schedule:
    - cron: '32 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: veriko-mx-labs/.github/.github/workflows/sync-public-spec.yml@4ec5ae642abb9af75706063e91848e7afbc65128
    with:
      regenerate_command: 'true'
      auto_merge: true
    secrets:
      app_id: ${{ secrets.VERIKO_LABS_APP_ID }}
      app_private_key: ${{ secrets.VERIKO_LABS_PRIVATE_KEY }}
