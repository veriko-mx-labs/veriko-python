name: Sincronizar el spec público

on:
  schedule:
    - cron: '32 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: veriko-mx-labs/.github/.github/workflows/sync-public-spec.yml@d2fa5326dce29d508af3ce20f7b80d47b279e511
    with:
      regenerate_command: 'true'
      auto_merge: true
    secrets:
      app_id: ${{ secrets.VERIKO_LABS_APP_ID }}
      app_private_key: ${{ secrets.VERIKO_LABS_PRIVATE_KEY }}
