name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  autoria:
    if: github.event_name != 'workflow_dispatch'
    uses: veriko-mx-labs/.github/.github/workflows/autoria.yml@82b993be09334e9bf3f05a57073d9b95e5a749af
    secrets:
      config: ${{ secrets.VERIKO_LABS_AUTORIA_CONFIG }}
  lint:
    name: Estilo y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Instalar el paquete y sus herramientas
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: Los ejemplos compilan
        run: python -m compileall -q examples

  test:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04  # Python 3.9 ya no está en ubuntu-latest (26.04)
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar el paquete y sus herramientas
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest

  build:
    name: El paquete se construye
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Construir la distribución
        run: |
          pip install build twine
          python -m build
          twine check dist/*
