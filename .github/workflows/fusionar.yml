name: Fusionar

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Número del pull request.
        required: true
        type: number

permissions:
  contents: read

jobs:
  fusionar:
    uses: veriko-mx-labs/.github/.github/workflows/fusionar-como-veriko.yml@82b993be09334e9bf3f05a57073d9b95e5a749af
    with:
      pr: ${{ fromJSON(inputs.pr) }}
    secrets:
      app_id: ${{ secrets.VERIKO_LABS_APP_ID }}
      app_private_key: ${{ secrets.VERIKO_LABS_PRIVATE_KEY }}
