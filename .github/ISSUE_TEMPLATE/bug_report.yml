name: Reporte de error
description: Reporta algo que no funciona como está documentado.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        No pegues claves de API, comprobantes, números de cuenta ni datos de clientes. Reemplázalos con valores de ejemplo.
        Para una vulnerabilidad de seguridad, sigue la [política de seguridad](https://github.com/veriko-mx-labs/veriko-python/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: Qué pasa
      description: 'Describe el comportamiento que ves.'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducirlo
      description: 'Da la secuencia más corta que lo reproduce.'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperas
      description: 'Describe el comportamiento que la documentación o el spec te hacen esperar.'
    validations:
      required: true
  - type: input
    id: v0
    attributes:
      label: 'Versión de `veriko`'
      placeholder: '0.8.1'
    validations:
      required: true
  - type: input
    id: v1
    attributes:
      label: 'Versión de Python'
    validations:
      required: true
  - type: dropdown
    id: v2
    attributes:
      label: 'Cliente'
      options:
        - 'Veriko (síncrono)'
        - 'AsyncVeriko (asíncrono)'
    validations:
      required: true
  - type: input
    id: v3
    attributes:
      label: 'Sistema operativo'
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: 'request_id'
      description: 'El `request_id` de la respuesta de error, cuando la API respondió con un error (`error.request_id` en el error levantado).'
  - type: textarea
    id: output
    attributes:
      label: Salida o logs
      description: 'Pega el error o el cuerpo de la respuesta. Quita antes los secretos.'
  - type: checkboxes
    id: confirmation
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué entre los issues abiertos.
          required: true
        - label: Quité las claves de API y los datos personales de este reporte.
          required: true
