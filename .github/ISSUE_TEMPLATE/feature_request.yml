name: Feature request
description: Ask for a change or an addition.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, receipts, account numbers or customer data.
  - type: textarea
    id: problem
    attributes:
      label: What you need to do
      description: 'Describe the task you cannot do today, or do with too much work.'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: 'Describe the change you want to see.'
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: 'Describe what you use today or considered.'
  - type: input
    id: operation
    attributes:
      label: 'Related operation'
      description: 'The operation of the API this concerns, for example `POST /v1/validate`.'
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before you submit
      options:
        - label: I searched the open issues.
          required: true
