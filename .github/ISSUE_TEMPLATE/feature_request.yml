name: Solicitud de mejora
description: Pide un cambio o una adición.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        No pegues claves de API, comprobantes, números de cuenta ni datos de clientes.
  - type: textarea
    id: problem
    attributes:
      label: Qué necesitas hacer
      description: 'Describe la tarea que hoy no puedes hacer, o que te cuesta demasiado trabajo.'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Qué propones
      description: 'Describe el cambio que quieres ver.'
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas
      description: 'Describe lo que usas hoy o lo que consideraste.'
  - type: input
    id: operation
    attributes:
      label: 'Operación relacionada'
      description: 'La operación de la API a la que se refiere, por ejemplo `POST /v1/validate`.'
  - type: checkboxes
    id: confirmation
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué entre los issues abiertos.
          required: true
