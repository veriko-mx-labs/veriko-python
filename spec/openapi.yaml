    PatchBeneficiaryImportRowRequest:
      type: object
      description: 'Cuerpo de `PATCH /v1/beneficiaries/imports/{id}/rows/{row_id}`. Acepta envoltorio JSON:API `{ data: { attributes: {...} } }` o un objeto plano. Todos los atributos son opcionales — solo se sobreescriben los presentes. Cinco campos editables: `parsed_account`, `parsed_label`, `parsed_account_type`, `parsed_bank_code`, `parsed_bank_name`. Cualquier otra clave se ignora. Si el cuerpo no contiene ningún campo editable reconocido → `422 no_valid_fields`. Si la importación no está en estado `preview_ready` → `422 job_not_editable`. Tras persistir la corrección, el servidor re-procesa la fila (re-deriva banco a partir del prefijo CLABE / BIN nuevos) para que los contadores de la importación y la columna Banco de la vista previa queden sincronizados sin esperar a la confirmación.'
      x-translations:
        en:
          description: 'Body for `PATCH /v1/beneficiaries/imports/{id}/rows/{row_id}`. Accepts the JSON:API envelope `{ data: { attributes: {...} } }` or a flat object. All attributes are optional — only those present are overwritten. Five editable fields: `parsed_account`, `parsed_label`, `parsed_account_type`, `parsed_bank_code`, `parsed_bank_name`. Any other key is ignored. If no recognized editable field is present → `422 no_valid_fields`. If the job is not in `preview_ready` state → `422 job_not_editable`. After persisting the override, the server re-processes the row (re-derives bank from the new CLABE prefix / BIN) so that job counters and the preview''s Bank column stay in sync without waiting for commit.'
      properties:
        parsed_account:
          type: string
          pattern: ^[0-9 \-\xC2\xA0]{0,32}$
          maxLength: 32
          description: Número de cuenta corregido por el usuario. Acepta máximo 32 caracteres de dígitos. Se re-normaliza al re-procesar.
          example: '012180004412345678'
          x-translations:
            en:
              description: User-corrected account number. Accepts up to 32 characters of digits. It is re-normalized on re-processing.
        parsed_label:
          type: string
          maxLength: 100
          description: Etiqueta corregida de la fila. Si empieza por `=`, `+`, `-` o `@`, se guarda con un apóstrofo delante para que una hoja de cálculo no la lea como fórmula.
          example: Mamá
          x-translations:
            en:
              description: Corrected row label. If it starts with `=`, `+`, `-` or `@`, it is stored with a leading apostrophe so a spreadsheet does not read it as a formula.
        parsed_account_type:
          type: string
          enum:
            - clabe
            - card
            - phone
          description: 'Tipo de cuenta corregido. `clabe`: CLABE (18 dígitos); `card`: tarjeta (16 dígitos); `phone`: celular/DiMo (10 dígitos).'
          example: clabe
          x-translations:
            en:
              description: 'Corrected account type. `clabe`: CLABE (18 digits); `card`: card (16 digits); `phone`: phone/DiMo (10 digits).'
        parsed_bank_code:
          type: string
          pattern: ^\d{4,5}$
          description: Código SPEI corregido (5 dígitos). Útil para cuentas tipo `phone` que necesitan reasignación de banco. Para CLABE/card se sobrescribe en su re-derivación.
          example: '40012'
          x-translations:
            en:
              description: Corrected SPEI code (5 digits). Useful for `phone` rows that need bank reassignment. For CLABE/card it is overridden on re-derivation.
        parsed_bank_name:
          type: string
          maxLength: 50
          description: Nombre del banco corregido. Puede sobrescribirse durante la re-derivación.
          example: BBVA MEXICO
          x-translations:
            en:
              description: Corrected bank name. May be overridden during re-derivation.
    PatchBeneficiaryImportRowResponse:
      type: object
      description: 'Respuesta de `PATCH /v1/beneficiaries/imports/{id}/rows/{row_id}`: la fila ya corregida y reprocesada. Su grupo de clasificación (`status`) puede haber cambiado con la corrección.'
      x-translations:
