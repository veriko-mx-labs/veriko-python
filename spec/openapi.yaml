              items:
                $ref: '#/components/schemas/Beneficiary'
    CreateBeneficiaryRequest:
      type: object
      description: 'Cuerpo de `POST /v1/beneficiaries`. Acepta dos formas: un objeto plano con los atributos en la raíz, o el envoltorio JSON:API `{ data: { attributes: {...} } }`. El servidor prueba primero `data.attributes` y, si está ausente, toma el objeto raíz. El tipo de cuenta (`clabe`, `card`, `phone`) se autodetecta por la longitud de los dígitos: 18 = CLABE, 16 = tarjeta, 10 = celular (DiMo). Cuando el tipo detectado es `phone`, `bank_code` es **obligatorio**; para CLABE y tarjeta el `bank_code` enviado por el cliente se ignora y se deriva del prefijo CLABE o del BIN.'
      x-translations:
        en:
          description: 'Body for `POST /v1/beneficiaries`. Accepts two shapes: a flat object with attributes at the root, or the JSON:API envelope `{ data: { attributes: {...} } }`. The server tries `data.attributes` first and falls back to the root object. The account type (`clabe`, `card`, `phone`) is auto-detected by digit length: 18 = CLABE, 16 = card, 10 = phone (DiMo). When the detected type is `phone`, `bank_code` is **mandatory**; for CLABE and card the caller-supplied `bank_code` is ignored and derived from the CLABE prefix or BIN.'
      required:
        - account_number
      properties:
        account_number:
          type: string
          pattern: ^\d{10,19}$
          description: 'Número de cuenta. Se aceptan: CLABE (18 dígitos), tarjeta (16 dígitos) o celular/DiMo (10 dígitos). Los separadores, espacios y guiones se eliminan.'
          example: '012180004412345678'
          x-translations:
            en:
              description: 'Account number. Accepted: 18-digit CLABE, 16-digit card (only 18, reserved for CLABE) or 10-digit DiMo phone. Separators (spaces, hyphens) are stripped before validation.'
        bank_code:
          type: string
          pattern: ^\d{4,5}$
          description: Código SPEI (4 o 5 dígitos). **Obligatorio cuando el tipo detectado es** `phone`; ignorado para CLABE y tarjeta.
          example: '40012'
          x-translations:
            en:
              description: SPEI code (4 or 5 digits). **Required when the detected type is** `phone`; ignored for CLABE and card.
        label:
          type: string
          maxLength: 100
          description: Etiqueta opcional con la que la cuenta se identifica en la lista de beneficiarios.
          example: Proveedor ABC
          x-translations:
            en:
              description: |
                Optional label the account is identified by in the beneficiary list.
