                  example: CREDIT
                  x-translations:
                    en:
                      description: Card type (CREDIT, DEBIT, PREPAID, …), or `null` when unknown.
                card_level:
                  type:
                    - string
                    - 'null'
                  description: Nivel de la tarjeta (GOLD, PLATINUM, …), o `null` cuando se desconoce.
                  example: GOLD
                  x-translations:
                    en:
                      description: Card level (GOLD, PLATINUM, …), or `null` when unknown.
                country_iso:
