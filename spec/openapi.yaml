    RetryPolicy:
      type: object
      description: 'Política de reintentos de una validación: activación, límite, intervalo y resultados elegibles.'
      x-translations:
        en:
          description: |
            Validation retry policy: activation, limit, interval, and eligible outcomes.
      properties:
        enabled:
