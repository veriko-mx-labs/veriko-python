    GetUsageHistoryAttributes:
      type: object
      description: Historial mensual de consumo para el número de meses solicitado.
      x-translations:
        en:
          description: Monthly usage history for the requested number of months.
      properties:
        data:
          description: Cuerpo de la respuesta, en la envoltura JSON:API.
          x-translations:
            en:
              description: Response body, in the JSON:API envelope.
          type: object
          properties:
            type:
              description: Tipo de recurso JSON:API. Siempre `usage_history`.
              x-translations:
                en:
                  description: JSON:API resource type. Always `usage_history`.
              type: string
              enum:
                - usage_history
              example: usage_history
            attributes:
              description: 'Datos del historial: Número de meses y lo consumo por mes.'
              x-translations:
                en:
                  description: 'History data: the month count and the per-month usage.'
              type: object
              properties:
                months:
                  description: Cantidad de meses que cubre el historial devuelto.
                  x-translations:
                    en:
                      description: Number of months the returned history covers.
                  type: integer
                  example: 6
                history:
                  description: Un elemento por mes, del más reciente al más antiguo.
                  x-translations:
                    en:
                      description: One entry per month, most recent first.
                  type: array
                  items:
                    type: object
                    properties:
                      period:
                        description: Mes al que corresponde la fila, en formato `YYYY-MM`.
                        x-translations:
                          en:
                            description: Month the row belongs to, in `YYYY-MM` format.
                        type: string
                        example: 2026-04
                      used:
                        description: Cantidad de validaciones consumidas en ese mes.
                        x-translations:
                          en:
                            description: Number of validations consumed that month.
                        type: integer
                        example: 420
                      limit_at_time:
                        description: |-
                          Límite mensual que se muestra junto al consumo de esa fila.

                          **No es el límite que regía aquel mes**: es el límite vigente hoy, repetido en todas las filas. Si el plan cambió por el camino, los meses anteriores se ven contra un tope que entonces no era el suyo. La bandera de la fila lo advierte.
                        x-translations:
                          en:
                            description: |-
                              Monthly limit shown alongside that row's usage.

                              **It is not the limit that applied that month**: it is today's limit, repeated on every row. If the plan changed along the way, earlier months are shown against a cap that was not theirs at the time. The row flag says so.
                        type: integer
                        example: 1000
                      limit_is_current_snapshot:
                        description: '`true` cuando el límite mostrado en la fila es el de hoy y no el de aquel mes. Vale siempre `true`, porque el histórico de límites no se guarda.'
                        x-translations:
                          en:
                            description: '`true` when the limit shown on the row is today''s and not that month''s. Always `true`, because limit history is not stored.'
                        type: boolean
                        example: true
