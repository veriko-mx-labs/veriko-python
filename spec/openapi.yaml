              description: |
                Seconds to wait between each retry (300–86400, i.e., 5 minutes to 24 hours).
        outcomes:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            Resultados que originan un reintento. De forma predeterminada son `not_found`, `cep_unavailable` y `error`; la combinación `["not_found", "cep_unavailable"]` excluye `error`.
          items:
            type: string
            enum:
