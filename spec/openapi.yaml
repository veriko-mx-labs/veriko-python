      tags:
        - Usage
      summary: Consultar la cuota de validaciones para el plan del usuario
      description: |-
        Devuelve la cuota de validaciones del plan asignado al usuario autenticado:

        - El límite del plan.
        - Las validaciones consumidas.
        - Las validaciones restantes.
        - El porcentaje del límite consumido.

        El campo `tone` señala el nivel de aviso según ese porcentaje: `ok` por
        debajo del 70 %, `warn` entre el 70 % y el 89 %, y `danger` a partir del
        90 % o con la cuota agotada.

        `limit` es el del plan vigente, que devuelve
        [`GET /v1/billing/subscription`](/es/v1/billing/billing-get-subscription), y
        la marca de reinicio (`resets_at`) es el fin del ciclo de cuota: coincide con
        el `current_period_end` de esa suscripción salvo en un plan anual, donde la
        cuota se reinicia cada mes. `next_reset_at` es un alias de `resets_at`: las
        dos marcan el fin del ciclo de cuota en curso.

        Los límites de tasa, que no son cuota, los devuelve
        [`GET /v1/usage/limits`](/es/v1/usage/get-usage-limits).
      operationId: getUsageSummary
      externalDocs:
        url: https://docs.veriko.mx/how-to/monitor-usage
        description: Track API quota and billing-cycle consumption
      x-codeSamples:
