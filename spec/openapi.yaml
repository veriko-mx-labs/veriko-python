            Filtro — Estado de la entrega. `success` llegó. `failed` es el resultado del último intento; Messenger puede programar otro si el fallo es recuperable. `retrying` se pospuso por el límite de salida y Messenger la reintentará. `pending` todavía no se ha intentado.
          x-translations:
            en:
              description: Delivery state. `success` arrived. `failed` is the latest attempt's outcome; Messenger can schedule another one for a recoverable failure. `retrying` was deferred by the outbound limit and Messenger will retry it. `pending` has not been attempted yet.
        - name: event_type
          in: query
          schema:
            type: string
            enum:
              - validation.completed
              - validation.failed
              - validation.error
              - validation.retry.scheduled
              - validation.retry.resolved
              - validation.retry.exhausted
              - billing.payment_succeeded
              - billing.payment_failed
              - billing.trial_will_end
              - billing.subscription_canceled
              - billing.invoice_upcoming
              - test
          example: validation.completed
          description: |-

            Filtro — Tipo de evento que originó la entrega. **De validaciones**: `validation.completed` cuando termina bien, `validation.failed` cuando termina mal y `validation.error` cuando hay un error del servicio. **De los reintentos automáticos:** `validation.retry.scheduled` al programar un reintento automático, `validation.retry.resolved` cuando un reintento automático encuentra el CEP, y `validation.retry.exhausted` cuando los reintentos se agotan sin encontrar el CEP.\
            **De la suscripción:** `billing.payment_succeeded` y `billing.payment_failed` por cada cobro, `billing.invoice_upcoming` antes de la siguiente factura, `billing.trial_will_end` antes de que acabe la prueba gratuita, y `billing.subscription_canceled` al cancelar la suscripción. Las entregas sintéticas (envío de prueba) se marcan como `test`.
          x-translations:
            en:
              description: |-
                Type of event that produced the delivery.
                From a validation's lifecycle: `validation.completed` when it ends well, `validation.failed` when it ends badly, and `validation.error` when it fails on the service side. From its automatic retries: `validation.retry.scheduled` when one is scheduled, `validation.retry.resolved` when a retry ends up finding the receipt, and `validation.retry.exhausted` when they run out without success.
                From the subscription: `billing.payment_succeeded` and `billing.payment_failed` for each charge, `billing.invoice_upcoming` before the next invoice, `billing.trial_will_end` before the trial runs out, and `billing.subscription_canceled` when it is cancelled.
                `test` marks the synthetic deliveries from the test send.
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: csv
            enum:
              - csv
              - xlsx
          example: csv
          description: |-

            Formato del archivo a descargar. Valores aceptados: `csv` y `xlsx`. Cualquier otro valor se sirve como `csv`.
          x-translations:
            en:
              description: Output format. `csv` by default; `xlsx` produces a spreadsheet. Any other value is served as `csv`.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
          example: 500
          description: 'Filtro — Recorta el número de filas del archivo. Solo baja el tope: un valor mayor que 100 000, o menor que 1, deja el tope por defecto.'
          x-translations:
            en:
              description: 'Trims the number of rows in the file. It only lowers the cap: a value above 100,000, or below 1, leaves the default cap in place.'
      x-codeSamples:
        - lang: curl
          label: Shell
          source: |-
            curl -X GET 'https://api.veriko.mx/v1/webhooks/deliveries/export' \
              -H 'Authorization: Bearer veriko_••••'
      responses:
        '200':
          description: Archivo CSV o XLSX con el historial consolidado de entregas de todos los endpoints webhook (hasta 100 000 filas).
          x-translations:
            en:
              description: CSV or XLSX file with the consolidated delivery history across all endpoints (up to 100,000 rows).
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-translations:
        en:
          summary: Export all deliveries as CSV or XLSX
          description: |-
            Downloads the delivery history of **every** endpoint on the account as a
            file, under the same filters as the list: endpoint, status, and event
            type.

            {% concept slug="exports-and-formats" %}The format is
            chosen{% /concept %} with `?format`: `csv` by default, `xlsx` as the
            alternative — and the cap is 100,000 rows, which `?limit` can lower.

            Exporting before deleting an endpoint is worth doing:
            `DELETE /v1/webhooks/{id}` takes its history with it and there is no way
            to recover it.
      security:
        - ApiKeyAuth: []
