                  description: Import job fields.
              properties:
                plan_cap:
                  $ref: '#/components/schemas/BeneficiaryCapacity'
                status:
                  type: string
                  enum:
                    - pending
                    - parsing
                    - preview_ready
                    - committing
                    - completed
                    - failed
                    - cancelled
                  description: 'Estado del trabajo de importación — `pending`: Subido y en espera de parseo; `parsing`: En proceso de extracción de filas; `preview_ready`: Listo para revisión del usuario; `committing`: Persistiendo filas confirmadas; `completed`: Importación completada; `failed`: Fallo no recuperable (ver `error_code`); `cancelled`: Cancelado por el usuario.'
                  example: preview_ready
                  x-translations:
                    en:
                      description: 'Job status — `pending`: Uploaded, awaiting parsing; `parsing`: Extracting rows; `preview_ready`: Ready for user review; `committing`: Persisting confirmed rows; `completed`: Commit finished; `failed`: Non-recoverable failure (see `error_code`); `cancelled`: Cancelled by the user.'
                file_format:
                  type: string
                  enum:
                    - csv
                    - xls
                    - xlsx
                    - txt
                    - pdf
                  description: 'Formato del archivo subido. Aceptados: `csv`, `xls`, `xlsx`, `txt` o `pdf`.'
                  example: csv
                  x-translations:
                    en:
                      description: 'Format of the uploaded file. Accepted: `csv`, `xls`, `xlsx`, `txt` or `pdf`.'
                parse_mode:
                  type: string
                  enum:
                    - template
                    - free
                  description: 'Modo de lectura del archivo — `template`: Respeta los encabezados canónicos; `free`: Formato libre, el sistema deduce la estructura.'
                  example: template
                  x-translations:
                    en:
                      description: 'File reading mode — `template`: Follows the canonical headers; `free`: Free-form, the system infers the structure.'
                total_rows:
                  type: integer
                  minimum: 0
                  description: Cantidad de filas extraídas del archivo. Sólo disponible cuando el estado es `preview_ready` o posterior.
                  example: 150
                  x-translations:
                    en:
                      description: Number of rows extracted from the file. Only available once the status is `preview_ready` or later.
                valid_count:
                  type: integer
                  minimum: 0
                  description: Cantidad de filas sin errores, listas para la confirmación.
                  example: 120
                  x-translations:
                    en:
                      description: Number of rows without errors, ready to be committed.
                correctable_count:
                  type: integer
                  minimum: 0
                  description: Cantidad de filas con errores que admiten corrección. Se persisten salvo que el usuario las rechace.
                  example: 20
                  x-translations:
                    en:
                      description: Number of rows with errors that can be corrected. They are persisted unless the user rejects them.
                fatal_count:
                  type: integer
                  minimum: 0
                  description: Cantidad de filas que no pueden procesarse con sus datos actuales. No se persisten y se omiten de la confirmación.
                  example: 5
                  x-translations:
                    en:
                      description: Number of rows that cannot be processed with their current data. They are not persisted and are skipped on commit.
                duplicate_count:
                  type: integer
                  minimum: 0
                  description: Cantidad de filas detectadas como duplicadas dentro del trabajo. Las de `duplicate_account` se omiten de la confirmación, salvo que la cuenta esté archivada, en cuyo caso se reactiva; las de `duplicate_alias` se persisten con un sufijo en el alias.
                  example: 5
                  x-translations:
                    en:
                      description: Number of rows detected as duplicates within the job. Those with `duplicate_account` are skipped on commit, unless the account is archived, in which case it is reactivated; those with `duplicate_alias` are persisted with a suffix on the alias.
                committed_count:
                  type: integer
                  minimum: 0
                  description: Filas efectivamente persistidas en la lista de beneficiarios (solo disponible una vez que el estado es `completed`).
                  example: 140
                  x-translations:
                    en:
                      description: Rows effectively persisted in the beneficiary list. Available once status is `completed`.
                skipped_count:
                  type: integer
                  minimum: 0
                  description: Cantidad de filas omitidas durante la ejecución del trabajo. Son las fatales y las `duplicate_account` sin reactivación posible.
                  example: 10
                  x-translations:
                    en:
                      description: Number of rows skipped while the job was running. They are the fatal ones and the `duplicate_account` ones with no possible reactivation.
                llm_invoked:
