          example: operational
          x-translations:
            en:
              description: 'Aggregated service status — `operational`: all checks pass and latency is normal; `degraded`: partial issues (high latency or intermittent errors); `down`: service unreachable; `unknown`: no health check data available yet.'
        status_label:
          type: string
          description: Etiqueta legible del estado actual (resuelta según idioma de la llamada).
          example: Operativo
          x-translations:
            en:
              description: Human-readable status label, resolved to the request locale.
        message:
          type: string
          description: Explicación corta del estado actual del servicio de verificación de Banxico (resuelta según idioma de la llamada).
          example: El servicio de verificación está operando normalmente.
          x-translations:
            en:
              description: Short explanation of the current service status, resolved to the request locale.
