      x-translations:
        en:
          summary: Get the Banxico service status (public view)
          description: |-
            Returns the current operational status of the **Banxico validation
            service**, derived from periodic health checks.

            The status can be:

            - `operational`: All checks pass and latency is normal.
            - `degraded`: Partial issues — high latency or intermittent errors.
            - `down`: The service is unreachable for now.
            - `unknown`: No health check data is available yet.

            The response is cached 60 seconds on the client with `Cache-Control`,
            and that window is set at deploy time. Any authenticated user can query
            it, and no specific permission is required.

            {% callout type="info" %}
            **Synchronous validations during an outage:**\
            When the status is `degraded` or `down`, synchronous validations may
            respond with an HTTP `503` status (carrying
            `banxico_rate_limit_exhausted` in the body). Configure
            `PUT /v1/validations/{id}/retry-policy` to retry automatically once the
            Banxico service is available again.

            {% /callout %}
      security:
        - ApiKeyAuth: []
