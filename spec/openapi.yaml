          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: UUID inválido en la ruta (`invalid_uuid`).
          x-translations:
            en:
              description: Invalid UUID in path (`invalid_uuid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No se pudo iniciar la entrega (`dispatch_failed`).
          x-translations:
            en:
              description: Delivery could not be started (`dispatch_failed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-translations:
        en:
          summary: Send the CEP to Telegram
          description: |-
            Starts delivery of the CEP as a PDF to the Telegram chat linked to the owning account.

            An HTTP status `202` (with `queued: true` in the body) confirms that delivery is pending, not that it completed.

            It requires an available receipt and a linked Telegram account:

            - Without the document, it responds with an HTTP status `409` (with `cep_not_available` in the body).
            - Without the link, it responds with an HTTP status `409` (with `telegram_not_linked` in the body).
      security:
        - ApiKeyAuth: []
