          example: 1240
          x-translations:
            en:
              description: Number of validations in the scope, with no date bound.
        today:
          type: integer
          minimum: 0
          description: Cantidad de validaciones creadas en el día calendario actual (UTC).
          example: 37
          x-translations:
            en:
              description: Number of validations created on the current calendar day (UTC).
        yesterday:
          type: integer
          minimum: 0
          description: Cantidad de validaciones creadas en el día calendario anterior (UTC).
          example: 42
          x-translations:
            en:
              description: Number of validations created on the previous calendar day (UTC).
        success_rate:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Porcentaje de validaciones con veredicto `valid` sobre el total, expresado de 0 a 100.
          example: 94.2
          x-translations:
            en:
              description: |
                Percentage of validations with a `valid` verdict out of the total, expressed from 0 to 100.
        avg_latency_ms:
          type: integer
          minimum: 0
          description: Tiempo promedio de procesamiento (en milisegundos) de las últimas 24 horas.
          example: 810
          x-translations:
            en:
              description: |
                Average processing time over the last 24 hours, in milliseconds.
        by_banxico_7d:
          type: object
          description: |
            Distribución de veredictos de Banxico de los últimos 7 días. Las claves son valores de `banxico_status` (`valid`, `not_found`, `cep_unavailable`, `invalid`, `returned`, `error` o `pending`); los valores ausentes implican cero.
          x-translations:
            en:
              description: |
                Banxico verdict distribution for the last 7 days. Keys are `banxico_status` values (`valid`, `not_found`, `cep_unavailable`, `invalid`, `returned`, `error`, or `pending`); missing values imply zero.
          additionalProperties:
            type: integer
          example:
            valid: 210
            invalid: 8
            not_found: 3
            cep_unavailable: 2
            returned: 1
        scope:
          type: string
          enum:
            - self
            - global
          description: 'Alcance de los datos — `self`: Solo las validaciones del usuario autenticado; `global`: Todas las validaciones de la plataforma (solo para administradores).'
          example: self
          x-translations:
            en:
              description: |
                Data scope — `self`: Only the authenticated user's validations; `global`: All platform validations (administrators only).
    InsightsTrendsAttributes:
      type: object
      description: |
        Series temporales de validaciones cuyos puntos contienen métricas de volumen o latencia según `metric`.
      x-translations:
        en:
          description: |
            Validation time series whose points contain volume or latency metrics according to `metric`.
      properties:
        range:
          type: string
          enum:
            - 24h
            - 7d
            - 30d
            - 90d
          description: |
            Ventana de tiempo de la serie: `24h` (últimas 24 horas), `7d` (últimos 7 días), `30d` (últimos 30 días) o `90d` (últimos 90 días).
          example: 7d
          x-translations:
            en:
              description: |
                Time window of the series: `24h` (last 24 hours), `7d` (last 7 days), `30d` (last 30 days), or `90d` (last 90 days).
        metric:
          type: string
          enum:
            - volume
            - latency
          description: 'Métrica representada — `volume`: conteos de validaciones apilados por tipo; `latency`: tiempos de procesamiento (en percentiles).'
          example: volume
          x-translations:
            en:
              description: |
                Metric represented — `volume`: validation counts stacked by type; `latency`: processing times in percentiles.
        scope:
          type: string
          enum:
            - self
            - global
          description: 'Alcance de los datos — `self`: Solo las validaciones del usuario autenticado; `global`: Todas las validaciones de la plataforma (solo para administradores).'
          example: self
          x-translations:
            en:
              description: |
                Data scope — `self`: Only the authenticated user's validations; `global`: All platform validations (administrators only).
        series:
          type: array
          description: |
            Puntos de datos ordenados cronológicamente. La forma de cada punto depende de `metric`: para `volume` incluye `bucket`, `total`, `direct`, `ocr`, `valid`, `errored`; para `latency` incluye `bucket`, `p50`, `p95`, `p99`, `avg`.
          x-translations:
            en:
              description: |
                Data points in chronological order. The shape of each point depends on `metric`: for `volume` it includes `bucket`, `total`, `direct`, `ocr`, `valid`, `errored`; for `latency` it includes `bucket`, `p50`, `p95`, `p99`, `avg`.
          items:
            type: object
            description: Punto de la serie temporal (la forma exacta depende de `metric`).
            x-translations:
              en:
                description: Time-series data point (the exact shape depends on `metric`).
            additionalProperties: true
