              $ref: '#/components/schemas/TimestampUTC'
            deleted_at:
              oneOf:
                - $ref: '#/components/schemas/TimestampUTC'
                - type: 'null'
              description: Fecha de retiro del historial, en ISO 8601 UTC.
              x-translations:
                en:
                  description: History withdrawal date in ISO 8601 UTC.
            retry_state:
              $ref: '#/components/schemas/RetryStateCompact'
    ValidationStats:
      type: object
      description: |
        Recurso JSON:API con contadores por `banxico_status`, estado del ciclo de vida y modalidad de validación.
      x-translations:
        en:
          description: |
            JSON:API resource with validation counters by `banxico_status`, lifecycle state, and validation mode.
      properties:
        type:
          type: string
          enum:
            - validation_stats
          description: Tipo de recurso JSON:API. Siempre `validation_stats`.
          example: validation_stats
          x-translations:
            en:
              description: JSON:API resource type. Always `validation_stats`.
        attributes:
          type: object
          description: |
            Contadores agregados bajo los filtros de la petición.
          x-translations:
            en:
              description: |
                Aggregated counters under the request filters.
          properties:
            total:
              type: integer
              minimum: 0
              description: Cantidad de validaciones que cumplen los filtros, sin distinguir veredicto.
              example: 47
              x-translations:
                en:
                  description: |
                    Validations matching the filters, regardless of verdict.
            valid:
              type: integer
              minimum: 0
              description: Cantidad de validaciones confirmadas por Banxico (CEP disponible).
              example: 35
              x-translations:
                en:
                  description: Number of validations confirmed by Banxico (CEP available).
            not_found:
              type: integer
              minimum: 0
              description: Cantidad de validaciones sin CEP y sin coincidencia en Banxico.
              example: 5
              x-translations:
                en:
                  description: Number of transfers with no match in Banxico.
            cep_unavailable:
              type: integer
              minimum: 0
              description: Cantidad de validaciones cuyo CEP no estaba disponible aunque Banxico reconoció la transacción.
              example: 2
              x-translations:
                en:
                  description: Number of validations whose CEP was not available even though Banxico recognized the transaction.
            returned:
              type: integer
              minimum: 0
              description: Cantidad de validaciones cuya operación se liquidó y después se devolvió.
              example: 0
              x-translations:
                en:
                  description: Number of validations whose transfer was settled and later returned.
            error:
              type: integer
              minimum: 0
              description: Cantidad de validaciones sin veredicto concluyente por un error.
              example: 1
              x-translations:
                en:
                  description: |
                    Validations without a conclusive verdict because of an error.
            pending:
              type: integer
              minimum: 0
              description: Cantidad de validaciones cuyo procesamiento está en curso.
              example: 1
              x-translations:
                en:
                  description: Number of validations whose processing is under way.
            deleted:
              type: integer
              minimum: 0
              description: Cantidad de validaciones retiradas que cumplen los demás filtros.
              example: 2
              x-translations:
                en:
                  description: |
                    Withdrawn validations matching the remaining filters.
            other:
              type: integer
              minimum: 0
              description: |
                Diferencia entre `total` y los seis contadores de veredicto.
              example: 1
              x-translations:
                en:
                  description: |
                    Difference between `total` and the six verdict counters.
            by_type:
              type: object
              description: |
                Desglose por tipo de validación. `direct + ocr` siempre suma `total`.
              x-translations:
                en:
                  description: |
                    Breakdown by validation type. `direct + ocr` always sums to `total`.
              properties:
                direct:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones realizadas mediante captura manual.
                  example: 30
                  x-translations:
                    en:
                      description: Manual validations using CLABE, card, or phone fields.
                ocr:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones realizadas mediante imagen (OCR).
                  example: 17
                  x-translations:
                    en:
                      description: OCR validations (from a receipt image).
              required:
                - direct
                - ocr
            by_status:
              type: object
              description: Desglose por estado del ciclo de vida. Las propiedades siempre están presentes y suman `total`.
              x-translations:
                en:
                  description: |
                    Breakdown by lifecycle state. All nine properties are always present and add up to `total`.
              properties:
                queued:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones aceptadas que esperan procesamiento.
                  example: 3
                  x-translations:
                    en:
                      description: Accepted validations awaiting processing.
                processing:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones cuyo procesamiento está en curso.
                  example: 1
                  x-translations:
                    en:
                      description: Validations currently being processed.
                valid:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones confirmadas por Banxico (CEP disponible).
                  example: 35
                  x-translations:
                    en:
                      description: Validations with a transfer confirmed in the CEP.
                not_found:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones sin CEP y sin coincidencia en Banxico.
                  example: 5
                  x-translations:
                    en:
                      description: Validations with no matching transfer in the CEP.
                cep_unavailable:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones cuyo CEP no estaba disponible aunque Banxico reconoció la transacción.
                  example: 2
                  x-translations:
                    en:
                      description: Number of validations whose CEP was not available even though Banxico recognized the transaction.
                invalid:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones rechazadas por datos inválidos.
                  example: 1
                  x-translations:
                    en:
                      description: Validations rejected because of invalid data.
                returned:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones cuya operación se liquidó y después se devolvió.
                  example: 0
                  x-translations:
                    en:
                      description: Validations whose transfer was settled and later returned.
                failed:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones con un fallo terminal de procesamiento.
                  example: 0
                  x-translations:
                    en:
                      description: Validations with a terminal processing failure.
                error:
                  type: integer
                  minimum: 0
                  description: Cantidad de validaciones cuyo procesamiento terminó con un error.
                  example: 1
                  x-translations:
                    en:
                      description: Validations whose processing ended with an error.
              required:
                - queued
                - processing
                - valid
                - not_found
                - cep_unavailable
                - invalid
                - returned
                - failed
                - error
    RetryAttempt:
      type: object
      description: |
        Intento de reintento automático de una validación.
      x-translations:
        en:
          description: |
            Automatic retry attempt for a validation.
      properties:
        attempt_number:
          type: integer
          minimum: 1
          description: Posición del intento en el ciclo, comenzando en `1`.
          example: 1
          x-translations:
            en:
              description: Attempt position in the cycle, starting at `1`.
        dispatched_at:
          $ref: '#/components/schemas/TimestampUTC'
        started_at:
          $ref: '#/components/schemas/TimestampUTC'
        finished_at:
          $ref: '#/components/schemas/TimestampUTC'
        prev_banxico_status:
          type: string
          enum:
            - valid
            - not_found
            - cep_unavailable
            - invalid
            - error
          description: |
            Veredicto de Banxico anterior al intento.
          example: not_found
          x-translations:
            en:
              description: |
                Banxico verdict before the attempt.
        new_banxico_status:
          type:
            - string
            - 'null'
          enum:
            - valid
            - not_found
            - cep_unavailable
            - invalid
            - error
            - null
          description: Veredicto de Banxico obtenido en el intento; `null` cuando no hubo respuesta.
          example: valid
          x-translations:
            en:
              description: Banxico verdict obtained by the attempt; `null` when there was no response.
        prev_status:
          type: string
          enum:
            - queued
            - processing
            - valid
            - not_found
            - cep_unavailable
            - invalid
            - failed
            - error
          description: Estado de la validación antes del intento.
          example: not_found
          x-translations:
            en:
              description: Validation state before the attempt.
        new_status:
          type:
            - string
            - 'null'
          enum:
            - queued
            - processing
            - valid
            - not_found
            - cep_unavailable
            - invalid
            - failed
            - error
            - null
          description: Estado de la validación después del intento; `null` cuando no hubo transición.
          example: valid
          x-translations:
            en:
              description: Validation state after the attempt; `null` when there was no transition.
        processing_time_ms:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Tiempo de procesamiento del intento (en milisegundos). `null` cuando el intento no completó.
          example: 1250
          x-translations:
            en:
              description: Processing time for the attempt in milliseconds. `null` when the attempt did not complete.
        error_code:
          oneOf:
            - $ref: '#/components/schemas/ValidationErrorCode'
            - type: 'null'
          description: Código del error producido por el intento; `null` cuando no hubo error.
          example: network
          x-translations:
            en:
              description: Error code produced by the attempt; `null` when there was no error.
        proxy_pool_member:
          type:
            - string
            - 'null'
          description: Identificador de la ruta de salida por la que se consultó a Banxico.
          example: proxy-03
          x-translations:
            en:
              description: |
                Identifier of the outbound route used to query Banxico.
    UpdateValidationRetryPolicyRequest:
      type: object
