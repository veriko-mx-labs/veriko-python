                  en:
                    description: How many of them found the receipt and match.
                type: integer
                example: 11
              verified_volume:
                description: Importe sumado de las transferencias cuyo comprobante se encontró y cuadra.
                x-translations:
                  en:
                    description: Summed amount of transfers whose receipt was found and matches.
                type: number
                example: 42100
              unverified_volume:
                description: 'Importe sumado del resto: las que no se pudieron verificar, por no encontrarse el comprobante o por no cuadrar.'
                x-translations:
                  en:
                    description: 'Summed amount of the rest: those that could not be verified, either because the receipt was not found or because it does not match.'
                type: number
                example: 8500
        top_counterparties:
          type: array
          description: |
            Top 5 cuentas beneficiarias del usuario por volumen verificado en el mes.
          x-translations:
