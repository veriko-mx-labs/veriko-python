    BillingSubscriptionAttributes:
      type: object
      description: Suscripción activa del usuario, con su origen, estado, ciclo y límites. Cada usuario tiene exactamente una. Los campos `trial_*`, `cancel_*` y `stripe_subscription_id` son nulos cuando no aplican.
      x-translations:
        en:
          description: The user's active subscription, including its source, state, cycle, and limits. Each user has exactly one. The `trial_*`, `cancel_*`, and `stripe_subscription_id` fields are null when not applicable.
      properties:
        plan_slug:
          type: string
          description: Identificador único y legible del plan. Corresponde al plan activo del usuario.
          example: pro
          x-translations:
            en:
              description: Unique, human-readable plan identifier. It corresponds to the user's active plan.
        plan_name:
          type: string
          description: Nombre del plan que muestran las interfaces.
          example: Pro
          x-translations:
            en:
              description: Plan name shown in the interfaces.
        billing_model:
          type: string
          enum:
            - free
            - tiered
            - metered
            - hybrid
          description: 'Modelo de facturación del plan — `free`: Sin cobro; `tiered`: Cuota fija; `metered`: Cobro por consumo; `hybrid`: Cuota fija más consumo.'
          example: hybrid
          x-translations:
            en:
              description: 'Plan billing model. `free`: No charge; `tiered`: Flat fee; `metered`: Charged by usage; `hybrid`: Flat fee plus usage.'
        source:
          type: string
          enum:
            - stripe
            - admin_granted
            - system_default
          description: 'Origen de la suscripción — `stripe`: Pago mediante Stripe; `admin_granted`: Concesión administrativa; `system_default`: Plan asignado por el sistema.'
          example: stripe
          x-translations:
            en:
              description: 'Subscription source — `stripe`: Payment through Stripe; `admin_granted`: Admin grant; `system_default`: Plan assigned by the system.'
        status:
          type: string
          enum:
            - active
            - trialing
            - past_due
            - canceled
            - unpaid
            - incomplete
            - incomplete_expired
            - paused
          description: 'Estado del ciclo de vida de la suscripción — `active`: Activa; `trialing`: En periodo de prueba; `past_due`: Con un cobro vencido y acceso todavía habilitado; `canceled`: Terminada; `unpaid`: Con cobros fallidos y sin acceso; `incomplete`: Primer pago pendiente; `incomplete_expired`: Primer pago vencido; `paused`: En pausa.'
          example: active
          x-translations:
            en:
              description: 'Subscription lifecycle state — `active`: Active; `trialing`: In a trial period; `past_due`: Payment overdue with access still enabled; `canceled`: Ended; `unpaid`: Failed payments with no access; `incomplete`: First payment pending; `incomplete_expired`: First payment expired; `paused`: Paused.'
        current_period_start:
          $ref: '#/components/schemas/TimestampUTC'
        current_period_end:
          $ref: '#/components/schemas/TimestampUTC'
        currency:
          type: string
          enum:
            - MXN
            - USD
          description: 'Moneda del precio — `MXN`: Pesos mexicanos; `USD`: Dólares estadounidenses.'
          example: MXN
          x-translations:
            en:
              description: Currency of the active cycle. `MXN` is Mexican pesos and `USD`, US dollars.
        billing_interval:
          type: string
          enum:
            - month
            - year
            - once
          description: 'Cadencia de facturación — `once`: Ciclo único, sin renovación automática; `month`: Cada mes; `year`: Cada año.'
          example: month
          x-translations:
            en:
              description: 'Billing cadence — `once`: One cycle with no automatic renewal; `month`: Monthly; `year`: Yearly.'
        overage_enabled:
          type: boolean
          description: |
            `true` cuando el usuario aceptó cobro por excedente en un plan `hybrid`. En ese caso, `effective_limit` salta de `included_validations` a `monthly_validation_limit`.
          example: false
          x-translations:
            en:
              description: |
                `true` when the user has opted into overage billing on a `hybrid` plan. When so, `effective_limit` jumps from `included_validations` to `monthly_validation_limit`.
        included_validations:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Validaciones incluidas en la cuota base antes del cobro por excedentes. `null` cuando el plan no tiene cuota base.
          example: 500
          x-translations:
            en:
              description: Validations included in the base quota before overage charges. `null` when the plan has no base quota.
        monthly_validation_limit:
          type: integer
          minimum: 0
          description: Tope de validaciones por ciclo de la suscripción. `0` no permite validaciones. En planes `hybrid`, es el tope duro cuando `overage_enabled` es `true`; cuando es `false`, `effective_limit` usa `included_validations`. En los demás modelos, es el límite efectivo salvo que exista un ajuste administrativo.
          example: 10000
          x-translations:
            en:
              description: Validation cap per subscription cycle. `0` allows no validations. On `hybrid` plans, it is the hard cap when `overage_enabled` is `true`; when it is `false`, `effective_limit` uses `included_validations`. On other models, it is the effective limit unless an admin override applies.
        beneficiaries_max:
          type: integer
          minimum: -1
          description: Tope de beneficiarios registrados por cuenta. `-1` significa sin tope; desde `0`, el valor se aplica como límite.
          example: -1
          x-translations:
            en:
              description: Cap on registered beneficiaries per account. `-1` means uncapped; from `0`, the value is enforced as the limit.
        bulk_validations_max:
          type: integer
          minimum: 0
          description: Cantidad máxima de validaciones por trabajo de importación. `0` no permite importar validaciones.
          x-translations:
            en:
              description: Maximum number of validations per import job. `0` allows no validation imports.
        effective_limit:
          type: integer
          minimum: 0
          description: Límite efectivo de validaciones para el ciclo actual. Incorpora los ajustes administrativos y, en planes `hybrid`, la regla de `overage_enabled`. Es el valor contra el que se decide si una validación se atiende o se rechaza.
          example: 500
          x-translations:
            en:
              description: Effective validation limit for the current cycle. It includes admin overrides and, on `hybrid` plans, the `overage_enabled` rule. This is the value used to decide whether a validation is served or rejected.
        is_stripe:
          type: boolean
          description: '`true` cuando `source` es `stripe`.'
          example: true
          x-translations:
            en:
              description: '`true` when `source` is `stripe`.'
        stripe_subscription_id:
          type:
            - string
            - 'null'
          description: Identificador de la suscripción en Stripe (`sub_...`). `null` cuando `source` no es `stripe`.
          example: sub_1OaBcDeFgHiJk2
          x-translations:
            en:
              description: Stripe subscription identifier (`sub_...`). `null` when `source` is not `stripe`.
        grant_reason:
          type:
            - string
            - 'null'
          description: |
            Motivo registrado cuando la suscripción fue otorgada por un
                administrador. `null` cuando `source` no es `admin_granted`.
          example: cortesía soporte
          x-translations:
            en:
              description: |
                Reason recorded when the subscription was granted by an admin. `null` when `source` is not `admin_granted`.
        cancel_at_period_end:
          type: boolean
          description: '`true` cuando la suscripción está programada para cancelarse al cierre del ciclo actual.'
          example: false
          x-translations:
            en:
              description: '`true` when the subscription is scheduled to cancel at the end of the current cycle.'
        cancel_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Fecha y hora programada para la cancelación, en ISO 8601 UTC. `null` cuando no hay una cancelación programada mediante `cancel_at`.
          x-translations:
            en:
              description: |
                Date and time the cancellation is scheduled for, in ISO 8601 UTC. `null` when no cancellation is scheduled through `cancel_at`.
          example: '2026-04-30T10:15:00Z'
        canceled_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Fecha y hora en que la cancelación se consumó, en ISO 8601 UTC. `null` mientras la suscripción está activa.
          x-translations:
            en:
              description: |
                Date and time the cancellation took effect, in ISO 8601 UTC. `null` while the subscription is active.
          example: '2026-04-30T10:15:00Z'
        trial_start:
          type:
            - string
            - 'null'
          format: date-time
          description: Fecha y hora de inicio del periodo de prueba, en ISO 8601 UTC. `null` cuando no hay periodo de prueba.
          x-translations:
            en:
              description: Date and time the trial period starts, in ISO 8601 UTC. `null` when there is no trial period.
          example: '2026-04-30T10:15:00Z'
        trial_end:
          type:
            - string
            - 'null'
          format: date-time
          description: Fecha y hora de fin del periodo de prueba, en ISO 8601 UTC. `null` cuando no hay periodo de prueba.
          x-translations:
            en:
              description: Date and time the trial period ends, in ISO 8601 UTC. `null` when there is no trial period.
          example: '2026-04-30T10:15:00Z'
