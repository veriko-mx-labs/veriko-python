  /beneficiaries/imports/{id}/commit:
    post:
      x-related:
        - DELETE /v1/beneficiaries/imports/{id}
        - GET /v1/beneficiaries/imports/{id}
        - GET /v1/beneficiaries/imports/{id}/preview
        - PATCH /v1/beneficiaries/imports/{id}/rows/{row_id}
        - GET /v1/beneficiaries/imports/template
        - POST /v1/beneficiaries/imports
      tags:
        - Beneficiaries
      summary: Confirmar la importación masiva
      description: |-
        Confirma un trabajo de importación y dispara la persistencia de sus filas en `GET /v1/beneficiaries`.

        La operación es asíncrona: el endpoint responde con un estado HTTP `202` y la importación pasa a estado `committing` mientras el trabajador procesa las filas. `GET /v1/beneficiaries/imports/{id}` admite sondeo hasta que el estado sea `completed` o `failed`.

        Reglas de la confirmación:

        - Filas `valid` y `correctable`: Se persisten (con sufijo de alias si hubo colisión de alias).
        - Filas `fatal` y `duplicate_account`: Se omiten.
        - Cuentas previamente archivadas con el mismo número: Se reactivan en lugar de duplicarse.
      operationId: commitBeneficiaryImport
      externalDocs:
        url: https://docs.veriko.mx/how-to/beneficiary-import
        description: Asistente de importación de beneficiarios por lotes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 42
          description: ID numérico del trabajo de importación.
          x-translations:
            en:
              description: Numeric ID of the import job.
      x-codeSamples:
        - lang: curl
          label: Shell
          source: |-
            curl -X POST 'https://api.veriko.mx/v1/beneficiaries/imports/{id}/commit' \
              -H 'Authorization: Bearer veriko_••••' \
              -H 'Content-Type: application/json'
      responses:
        '202':
          description: Commit encolado al trabajador. La importación pasa a `committing`.
          x-translations:
            en:
              description: Commit enqueued to the worker. The job transitions to `committing`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitBeneficiaryImportResponse'
              example:
                data:
                  type: beneficiary_import
                  id: '42'
                  attributes:
                    status: committing
                meta:
                  version: 1.47.0
                  api_version: v1
                  request_id: f4a5b6c7d8e9
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Pre-condición de confirmación no cumplida. Los códigos posibles son `job_not_committable` (si el estado no es `preview_ready`), `plan_cap_exceeded` (cuando el tope esté activo) y el genérico `commit_failed`.
          x-translations:
            en:
              description: Commit pre-condition failed. The possible codes are `job_not_committable` (when the state is not `preview_ready`), `plan_cap_exceeded` (when the cap is active) and the generic `commit_failed`.
              example:
                errors:
                  - detail: Commit not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - status: '422'
                    code: job_not_committable
                    detail: La confirmación no está permitida en este estado.
                meta:
                  version: 1.47.0
                  api_version: v1
                  request_id: a5b6c7d8e9f0
      x-translations:
        en:
          summary: Confirm the bulk import
          description: |-
            Confirms an import job and triggers the persistence of its rows into
            `GET /v1/beneficiaries`. The operation is asynchronous: the endpoint
            responds with HTTP status `202` and the import moves to `committing`
            while the worker processes the rows.
            `GET /v1/beneficiaries/imports/{id}` accepts polling until the state is
            `completed` or `failed`. Commit rules:

            - `valid` and `correctable` rows are persisted, with an alias suffix if
              there was an alias collision.
            - `fatal` and `duplicate_account` rows are skipped.
            - Previously archived accounts with the same number are reactivated
              instead of duplicated.
      security:
        - ApiKeyAuth: []
