              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-related:
        - POST /v1/validate-ocr
        - GET /v1/validations/{id}
        - PUT /v1/validations/{id}/retry-policy
        - GET /v1/validations
      x-translations:
        en:
          summary: Manually validate a SPEI transfer
          description: |-
            Validates a SPEI transfer against the **Banxico** CEP from the fields
            you send.

            The following data is required:

            - Date.
            - Amount.
            - Tracking key / Numeric reference.
            - Sending bank.
            - Receiving bank.
            - Beneficiary account.

            The final verdict (terminal state) can be one of the following:

            - `valid`: The transfer CEP was found and validated.
            - `not_found`: The transfer CEP was NOT found.
            - `cep_unavailable`: Banxico recognized the transfer, but the CEP is not
              currently available.
            - `returned`: the transfer was settled and the beneficiary institution
              later sent it back. The CEP, when there is one, is still delivered.
            - `error`: Internal service error.

            A `not_found`, `cep_unavailable`, or `error` verdict is not necessarily
            final: the CEP may take time to be published. In that case, **automatic
            retries** can be used by sending `retry_policy` in the request body,
            according to {% concept slug="retry-policy" %}the retry policy{% /concept
            %}.

            {% callout type="info" %}
            **Asynchronous mode:**\
            With `?async=1` in the URL, the operation runs in the background and
            returns an immediate HTTP status `202` with the validation ID in the
            body.\
            \
            The verdict is collected by polling `GET /v1/validations/{id}` until a
            terminal state. The use of `ETag` to avoid downloading the same content
            twice is covered in {% concept slug="async-validations" %}asynchronous
            operations{% /concept %}.

            {% /callout %}

            {% callout type="info" %}
            **Idempotency:**\
            The `Idempotency-Key` header is optional and prevents duplicate
            validations when a request is repeated. `5xx` responses are not stored,
            so a server failure does not make the idempotency key unusable.\
            Reusing the header with a different body produces HTTP status `422`
            (with `idempotency_key_reused` in the body).\
            Reusing it while the previous operation is still in progress produces
            HTTP status `409` (with `idempotency_key_in_progress` in the body).

            {% /callout %}

            **Each call consumes plan quota**, deducted when the request is
            accepted. If the quota is exhausted, the endpoint returns HTTP status
            `429` without attempting the validation.
      security:
        - ApiKeyAuth: []
  /validate-ocr:
    post:
      tags:
        - Validations
      summary: Validar una transferencia SPEI (OCR)
      description: |-
        Valida una transferencia SPEI a partir de la imagen de su comprobante. Extrae mediante reconocimiento óptico (OCR) los datos de la imagen y los valida en **Banxico** para obtener el CEP de la transacción.

        La imagen se envía como `image` o `image_url`. Si es enviada mediante una URL, el host destino deberá contar con protocolo seguro (SSL/HTTPS).

        {% callout type="info" %}
        El campo `cuenta_beneficiaria` permite enviar explícitamente la cuenta receptora de la transferencia, enviarlo es especialmente útil cuando la imagen no lleva este dato o lo lleva incompleto.\
        Puedes guardar esa cuenta como beneficiario (en `POST /v1/beneficiaries`) para no enviarla en cada validación, el sistema detectará en automático los dígitos visibles en cada imagen.

        {% /callout %}

        El veredicto final es el mismo que en la validación manual:

        - `valid`: El CEP de la transacción fue encontrado y validado.
        - `not_found`: El CEP de la transacción NO fue encontrado.
        - `cep_unavailable`: Banxico reconoció la transacción pero el CEP no está disponible por el momento.
        - `returned`: la transacción se liquidó y la institución beneficiaria la devolvió después. El CEP, si existe, se sigue entregando.
        - `error`: Error interno del servicio.

        {% callout type="info" %}
        **Modo asíncrono:**\
        Enviando `?async=1` en la URL, la imagen se comprueba antes de aceptar el trabajo y la respuesta es un estado HTTP `202` inmediato con el ID de la validación en el cuerpo.\
        \
        El veredicto se recoge sondeando `GET /v1/validations/{id}` hasta un estado terminal, como describe {% concept slug="async-validations" %}las operaciones asíncronas{% /concept %}.

        {% /callout %}

        {% callout type="info" %}
        **Idempotencia:**\
        La cabecera `Idempotency-Key` es opcional y evita duplicar una validación cuando se repite una petición. Las respuestas `5xx` no se guardan, de modo que un fallo del servidor no deja la clave de idempotencia inutilizable.\
        Reutilizar la cabecera con un cuerpo distinto provoca un estado HTTP `422` (con `idempotency_key_reused` en el cuerpo).\
        Reutilizar la cabecera mientras la operación anterior sigue en curso provoca un estado HTTP `409` (con `idempotency_key_in_progress` en el cuerpo).

        {% /callout %}

        {% callout type="warning" %}
        **Políticas de cobro (cuota):**\
        — Modo síncrono: Se descuenta la validación de la cuota al aceptar la petición, antes de comprobar la imagen. Es decir, una imagen inválida consume una validación.\
        — Modo asíncrono: La imagen se comprueba primero, así que una imagen inválida no consume nada.\
        \
        La cuota no se devuelve en ningún caso. Los reintentos automáticos posteriores no consumen una validación adicional, y el cómputo está en {% concept slug="quotas-and-plans" %}cuotas y planes{% /concept %}.

        {% /callout %}
