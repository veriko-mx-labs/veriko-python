    WebhookDelivery:
      type: object
      description: |
        Recurso JSON:API de una entrega de webhook, con receptor, intento, respuesta y estado.
      x-translations:
        en:
          description: |
            JSON:API resource for a webhook delivery, with receiver, attempt, response, and status.
      allOf:
        - $ref: '#/components/schemas/JsonApiResourceBase'
        - type: object
          properties:
            type:
              description: Tipo de recurso JSON:API. Siempre `webhook_delivery`.
              x-translations:
                en:
                  description: JSON:API resource type. Always `webhook_delivery`.
              type: string
              enum:
                - webhook_delivery
              example: webhook_delivery
            id:
              type: string
              pattern: ^[0-9]+$
              description: Identificador autoincremental de la entrega.
              x-translations:
                en:
                  description: Auto-increment delivery identifier.
              example: '48211'
            attributes:
              type: object
              description: Datos de la entrega webhook (endpoint receptor, intento, respuesta y estado).
              x-translations:
                en:
                  description: Webhook delivery data (receiver endpoint, attempt, response, and status).
              properties:
                endpoint_id:
                  type: string
                  format: uuid
                  description: Identificador único del endpoint webhook (UUID v4) que originó esta entrega.
                  x-translations:
                    en:
                      description: Unique identifier of the webhook endpoint (UUID v4) that originated this delivery.
                  example: a1b2c3d4-e5f6-7890-abcd-ef0123456789
                endpoint_url:
                  type: string
                  description: URL receptora del webhook (endpoint). Solo presente en el listado global (`GET /v1/webhooks/deliveries`).
                  x-translations:
                    en:
                      description: |
                        Receiver endpoint URL. Only present on the cross-endpoint list (`GET /v1/webhooks/deliveries`).
                  example: https://erp.example.com/hooks/pagos
                event_type:
                  type: string
                  description: Tipo de evento que originó la entrega. Determina la forma del cuerpo firmado con HMAC que recibe el receptor. Las entregas sintéticas (envío de prueba) se marcan como `test`.
                  x-translations:
                    en:
                      description: |
                        Event type that produced the delivery. Determines the shape of the HMAC-signed body the receiver gets. `test` marks the synthetic deliveries from the test send.
                  enum:
                    - validation.completed
                    - validation.failed
                    - validation.error
                    - validation.retry.scheduled
                    - validation.retry.resolved
                    - validation.retry.exhausted
                    - billing.payment_succeeded
                    - billing.payment_failed
                    - billing.trial_will_end
                    - billing.subscription_canceled
                    - billing.invoice_upcoming
                    - test
                  example: validation.completed
                validation_id:
                  type:
                    - string
                    - 'null'
                  format: uuid
                  description: Identificador único de la validación (UUID v4) asociada cuando el evento es `validation.*`. `null` cuando el evento es otro.
                  x-translations:
                    en:
                      description: |
                        Unique identifier of the associated validation (UUID v4) when the event is `validation.*`. `null` for any other event.
                  example: a1b2c3d4-e5f6-7890-abcd-ef0123456789
                response_status:
                  type:
                    - integer
                    - 'null'
                  minimum: 100
                  maximum: 599
                  description: Código de estado HTTP con el que respondió el endpoint webhook receptor. `null` cuando la entrega no llegó a establecer respuesta (tiempo de espera agotado o bloqueo).
                  x-translations:
                    en:
                      description: |
                        HTTP status code the receiver answered with. `null` when the delivery never completed a request (timeout or SSRF block).
                  example: 200
                response_body:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
                  description: Cuerpo de la respuesta del endpoint webhook receptor, truncado a 500 caracteres.
                  x-translations:
                    en:
                      description: Receiver response body, truncated to 500 characters.
                  example: '{"ok":true}'
                response_time_ms:
                  type:
                    - integer
                    - 'null'
                  minimum: 0
                  description: Duración de la petición de entrega (en milisegundos).
                  x-translations:
                    en:
                      description: Delivery request duration, in milliseconds.
                  example: 184
                attempt:
                  type: integer
                  minimum: 1
                  description: Número del intento. `1` es el primer envío; los mayores, reintentos.
                  x-translations:
                    en:
                      description: Attempt number. `1` is the first send; higher values are retries.
                  example: 1
                status:
                  type: string
                  enum:
                    - pending
                    - retrying
                    - success
                    - failed
                  description: 'Estado actual de la entrega — `pending`: Aún sin entregar; `retrying`: Se pospuso por el límite de salida y Messenger la reintentará; `success`: Entregada; `failed`: El último intento falló; Messenger puede programar otro si el fallo es recuperable.'
                  x-translations:
                    en:
                      description: 'Current delivery status. `pending`: Not delivered yet; `retrying`: Deferred by the outbound limit and Messenger will retry it; `success`: Delivered; `failed`: The latest attempt failed; Messenger can schedule another one for a recoverable failure.'
                  example: pending
                next_retry_at:
                  oneOf:
                    - $ref: '#/components/schemas/TimestampUTC'
                    - type: 'null'
                  description: |
                    Fecha y hora del próximo reintento persistido, en ISO 8601 UTC. `null` cuando no hay una fecha almacenada; los reintentos que programa Messenger no persisten esta fecha en la entrega.
                  x-translations:
                    en:
                      description: |
                        Date and time of the next persisted retry, in ISO 8601 UTC. `null` when no date is stored; retries scheduled by Messenger do not persist this date on the delivery.
                error_message:
                  type:
                    - string
                    - 'null'
                  description: Detalle de error del transporte o del bloqueo de la entrega. `null` cuando no hay un detalle de error, incluso si el receptor respondió con un estado fuera de `2xx`.
                  x-translations:
                    en:
                      description: Transport or delivery-block error detail. `null` when no error detail is available, including when the receiver answered with a non-`2xx` status.
                  example: Connection timed out after 10s
                created_at:
                  $ref: '#/components/schemas/TimestampUTC'
              required:
                - endpoint_id
                - event_type
                - validation_id
                - response_status
                - response_body
                - response_time_ms
                - attempt
                - status
                - next_retry_at
                - error_message
                - created_at
          required:
            - type
            - id
            - attributes
