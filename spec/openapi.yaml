                  x-translations:
                    en:
                      description: 'Lifecycle state — `queued`: Awaiting processing; `processing`: In progress; `valid`: The CEP was found and matches; `not_found`: Banxico cannot find the operation; `cep_unavailable`: Banxico recognizes the transaction but the CEP is not available; `invalid`: Banxico did not return a recognizable verdict; `returned`: the transfer was settled and later returned; `failed`: The validation stopped because of a problem in the data sent; `error`: The validation stopped because of a service failure.'
                banxico_status:
                  type:
                    - string
                    - 'null'
                  description: 'Veredicto reportado por Banxico. Puede ser: `valid`, `not_found`, `cep_unavailable`, `invalid`, `returned` o `error`. Permanece `pending` mientras no exista un veredicto de Banxico. `returned` significa que la operación se liquidó y la institución beneficiaria la devolvió después — el CEP, si existe, se sigue entregando. Solo toma `error` cuando la petición llegó a Banxico y el servicio falló; `error_code` identifica la causa.'
                  example: valid
                  x-translations:
                    en:
                      description: Verdict reported by Banxico. It can be `valid`, `not_found`, `cep_unavailable`, `invalid`, `returned`, or `error`. It remains `pending` while no Banxico verdict exists. `returned` means the transfer settled and the beneficiary institution later sent it back — the CEP, when there is one, is still delivered. It becomes `error` only when the request reached Banxico and the service failed; `error_code` identifies the cause.
                processing_time_ms:
                  type:
                    - integer
                    - 'null'
                  description: Tiempo (en milisegundos) empleados en procesar la validación.
                  example: 1320
                  x-translations:
                    en:
                      description: Milliseconds spent processing the validation.
                request_data:
                  type: object
                  description: Copia de los campos de la petición original.
                  additionalProperties: true
                  x-translations:
                    en:
                      description: Copy of the original request fields.
                created_at:
                  type: string
                  format: date-time
                  description: Fecha y hora, en ISO 8601 UTC, de creación de la validación.
                  example: '2025-03-15T14:22:10Z'
                  x-translations:
                    en:
                      description: Validation creation timestamp in ISO 8601 UTC.
                completed_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  description: Fecha y hora de la finalización, en ISO 8601 UTC. `null` mientras no haya terminado.
                  example: '2025-03-15T14:22:11Z'
                  x-translations:
                    en:
                      description: Date and time of completion, in ISO 8601 UTC. `null` while it has not finished.
                enqueued_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  description: Fecha y hora, en ISO 8601 UTC, de entrada a la cola.
                  x-translations:
                    en:
                      description: Queue-entry timestamp in ISO 8601 UTC.
                  example: '2026-04-30T10:15:00Z'
                processing_started_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  description: Fecha y hora, en ISO 8601 UTC, de inicio del procesamiento.
                  x-translations:
                    en:
                      description: Processing start timestamp in ISO 8601 UTC.
                  example: '2026-04-30T10:15:00Z'
                expires_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  description: Fecha y hora, en ISO 8601 UTC, de expiración para validaciones en cola. Tras esta marca, la validación pasa a `failed`.
                  x-translations:
                    en:
                      description: Expiration timestamp for queued validations in ISO 8601 UTC. After this, the validation moves to `failed`.
                  example: '2026-04-30T10:15:00Z'
                etag_version:
                  type:
                    - integer
                    - 'null'
                  description: Versión incremental (usada con `If-None-Match` en consultas condicionales).
                  example: 1
                  x-translations:
                    en:
                      description: Incremental version used with `If-None-Match` in conditional requests.
                image_path:
                  type:
                    - string
                    - 'null'
                  description: Referencia relativa de la imagen del comprobante (solo si `validation_type` es del tipo `ocr`).
                  x-translations:
                    en:
                      description: Relative receipt image reference, only when `validation_type` is `ocr`.
                  example: ocr/2026/04/a1b2c3d4.jpg
                ocr_result:
                  type:
                    - object
                    - 'null'
                  additionalProperties: true
                  description: Campos extraídos mediante OCR (solo si `validation_type` es del tipo `ocr`).
                  x-translations:
                    en:
                      description: Fields extracted through OCR, only when `validation_type` is `ocr`.
                ocr_confidence:
                  type:
                    - number
                    - 'null'
                  format: float
                  minimum: 0
                  maximum: 1
                  description: Puntaje de la extracción OCR 0–1 (solo si `validation_type` es del tipo `ocr`).
                  example: 0.94
                  x-translations:
                    en:
                      description: OCR score from 0 to 1, only when `validation_type` is `ocr`.
                normalized_data:
                  type:
                    - object
                    - 'null'
                  additionalProperties: true
                  description: Campos normalizados después de la extracción OCR (solo si `validation_type` es del tipo `ocr`).
                  x-translations:
                    en:
                      description: Fields normalized after OCR, only when `validation_type` is `ocr`.
                normalization_warnings:
                  type:
                    - array
                    - 'null'
                  items:
                    type: string
                  description: Advertencias de normalización presentes. Permiten explicar un resultado `not_found` inesperado.
                  x-translations:
                    en:
                      description: Normalization warnings present. They can explain an unexpected `not_found` result.
                is_masked:
                  type:
                    - boolean
                    - 'null'
                  description: Indica si el número de tarjeta está enmascarado en el comprobante cargado (solo si `validation_type` es del tipo `ocr`).
                  x-translations:
                    en:
                      description: Whether the card number is masked in the receipt, only when `validation_type` is `ocr`.
                banxico_result:
                  type:
                    - object
                    - 'null'
                  additionalProperties: true
                  description: |-
                    Datos devueltos por Banxico.

                    `_ocr_correction` conserva los campos corregidos, su lectura original (`requested`), el valor consultado (`used`) y la confirmación (`confirmed_by`). `status_query` indica una hipótesis confirmada por la consulta de estado; `cep` indica que también se obtuvo el comprobante. La consulta de estado por sí sola no verifica una transferencia.
                  x-translations:
                    en:
                      description: |-
                        Data returned by the Banxico CEP.

                        `_ocr_correction` records corrected fields, their original reading (`requested`), the queried value (`used`) and confirmation (`confirmed_by`). `status_query` indicates a hypothesis confirmed by the payment status query; `cep` indicates that the receipt was also obtained. A status query alone does not verify a transfer.
                error_message:
                  type:
                    - string
                    - 'null'
                  description: Mensaje legible del error terminal (si aplica).
                  x-translations:
                    en:
                      description: Human-readable error message when terminal.
                  example: Banxico no respondió tras tres intentos.
                error_code:
                  oneOf:
                    - $ref: '#/components/schemas/ValidationErrorCode'
                    - type: 'null'
                  description: |-
                    Código estable del error terminal (si aplica).

                    Tras `not_found`, el diagnóstico puede indicar `not_found_identity` (fecha, criterio o bancos), `not_found_account` (cuenta), `not_found_amount` (importe), `not_found_account_and_amount` (ambos) o `not_found_account_or_amount` (operación encontrada, sin aislar el campo). Un diagnóstico no cambia el veredicto ni acredita el pago. Sin respuesta concluyente, el campo queda en `null`.
                  x-translations:
                    en:
                      description: |-
                        Stable code of the terminal error, when there is one.

                        After `not_found`, diagnosis may indicate `not_found_identity` (date, criterion or banks), `not_found_account` (account), `not_found_amount` (amount), `not_found_account_and_amount` (both) or `not_found_account_or_amount` (payment found, field not isolated). A diagnosis does not change the verdict or prove payment. Without a conclusive response, the field remains `null`.
                batch_id:
                  type:
                    - integer
                    - 'null'
                  description: Identificador del trabajo de importación masiva (si aplica).
                  x-translations:
                    en:
                      description: Bulk import job identifier, when applicable.
                  example: 318
                batch_position:
                  type:
                    - integer
                    - 'null'
                  description: Posición dentro del trabajo (comenzando en 1).
                  x-translations:
                    en:
                      description: Position within the job, starting at 1.
                  example: 12
                retry_state:
                  allOf:
                    - $ref: '#/components/schemas/RetryStateFull'
                  description: Estado completo del ciclo de reintentos (siempre presente). Si la validación no tiene reintentos activos, `enabled` es `false` y los campos de política son `null`. Las validaciones de importación masiva siempre tienen `enabled` igual a `false`.
                  x-translations:
                    en:
                      description: |
                        Full retry cycle state. Always present; if retries are not active, `enabled` is `false` and policy fields are `null`. Bulk import rows always have `enabled` equal to `false`.
            links:
              type: object
              description: Enlaces relacionados (JSON:API `links`).
              x-translations:
                en:
                  description: Related links (JSON:API `links`).
              properties:
                self:
                  type: string
                  description: Enlace canónico al detalle de la validación.
                  example: /v1/validations/3fa85f64-5717-4562-b3fc-2c963f66afa6
                  x-translations:
                    en:
                      description: Canonical link to the validation details.
                cep_xml:
                  type:
                    - string
                    - 'null'
                  description: URL del CEP en formato XML. `null` cuando `status` no es `valid`, o es `returned` sin comprobante (la operación se devolvió antes de emitirse un CEP).
                  x-translations:
                    en:
                      description: URL of the CEP in XML format. `null` when `status` is not `valid`, or is `returned` with no receipt (the transfer was returned before a CEP was ever issued).
                  example: /v1/validations/a1b2c3d4-e5f6-7890-abcd-ef0123456789/cep.xml
                cep_pdf:
                  type:
                    - string
                    - 'null'
                  description: URL del CEP en formato PDF. `null` cuando `status` no es `valid`, o es `returned` sin comprobante (la operación se devolvió antes de emitirse un CEP).
                  x-translations:
                    en:
                      description: URL of the CEP in PDF format. `null` when `status` is not `valid`, or is `returned` with no receipt (the transfer was returned before a CEP was ever issued).
                  example: /v1/validations/a1b2c3d4-e5f6-7890-abcd-ef0123456789/cep.pdf
    ValidationQueued:
      type: object
      description: |
        Respuesta asíncrona de `POST /v1/validate?async=1` y `POST /v1/validate-ocr?async=1`. Contiene la validación encolada y los datos necesarios para consultar su resultado en `GET /v1/validations/{id}`.
      x-translations:
        en:
          description: |
            Asynchronous response from `POST /v1/validate?async=1` and `POST /v1/validate-ocr?async=1`. Contains the queued validation and the data needed to retrieve its result from `GET /v1/validations/{id}`.
      properties:
        data:
          type: object
          description: Envoltorio JSON:API del recurso encolado.
          x-translations:
            en:
              description: JSON:API wrapper for the queued resource.
          allOf:
            - $ref: '#/components/schemas/JsonApiResourceBase'
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - validation
                  description: Tipo de recurso JSON:API. Siempre `validation`.
                  example: validation
                  x-translations:
                    en:
                      description: JSON:API resource type. Always `validation`.
                id:
                  type: string
                  format: uuid
                  description: Identificador único de la validación creada (UUID v4), utilizable en `GET /v1/validations/{id}`.
                  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  x-translations:
                    en:
                      description: Unique identifier of the created validation (UUID v4), usable in `GET /v1/validations/{id}`.
                attributes:
                  type: object
                  description: Datos de la validación encolada.
                  x-translations:
                    en:
                      description: Fields of the queued resource.
                  properties:
                    validation_id:
                      type: string
                      format: uuid
                      description: UUID de la validación (idéntico a `data.id`).
                      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      x-translations:
                        en:
                          description: UUID of the validation (identical to `data.id`).
                    status:
                      type: string
                      enum:
                        - queued
                      description: Estado inmediato tras el encolamiento. Siempre `queued`.
                      example: queued
                      x-translations:
                        en:
                          description: Immediate status after queuing. Always `queued`.
                    etag_version:
                      type: integer
                      minimum: 0
                      description: |
                        Versión inicial del recurso para polling condicional con `If-None-Match`. Enviarla como ETag evita respuestas innecesarias cuando el estado no ha cambiado.
                      example: 0
                      x-translations:
                        en:
                          description: |
                            Initial resource version for conditional polling with `If-None-Match`. Sending it as an ETag avoids unnecessary responses when the status has not changed.
                    enqueued_at:
                      $ref: '#/components/schemas/TimestampUTC'
                    expires_at:
                      $ref: '#/components/schemas/TimestampUTC'
                    retry_state:
                      allOf:
                        - $ref: '#/components/schemas/RetryStateFull'
                      description: |
                        Estado del ciclo de reintentos automáticos al momento del encolamiento. Siempre presente; si no se configuró `retry_policy` en el body ni en la política del usuario, `enabled=false` y los campos de política son `null`.
                      x-translations:
                        en:
                          description: |
                            Automatic retry cycle state at queue time. Always present; if neither a body `retry_policy` nor a user default policy was provided, `enabled=false` and policy fields are `null`.
        meta:
          type: object
          description: Metadatos de control del flujo de polling.
          x-translations:
            en:
              description: Control metadata for the polling flow.
          properties:
            next_poll_after_seconds:
              type: integer
              minimum: 1
              description: |
                Segundos recomendados de espera antes del primer poll a `GET /v1/validations/{id}`. Sondear antes de este intervalo puede activar el límite de solicitudes.
              example: 2
              x-translations:
                en:
                  description: |
                    Recommended seconds to wait before the first poll to `GET /v1/validations/{id}`. Polling before this interval can trigger the request limit.
            playground:
              type: boolean
              description: '`true` cuando la validación pertenece al banco de pruebas (Playground). Campo reservado para compatibilidad: las respuestas asíncronas actuales lo omiten, porque el banco de pruebas no encola validaciones.'
              example: false
              x-translations:
                en:
                  description: '`true` when the validation belongs to the playground. Field reserved for compatibility: current asynchronous responses omit it, because the playground does not queue validations.'
    OcrValidationRequest:
      type: object
      anyOf:
        - required:
            - image
        - required:
            - image_url
      description: |
        Cuerpo de `POST /v1/validate-ocr` con la imagen en `image` o `image_url`; exige al menos uno de ambos campos.
      x-translations:
        en:
          description: |
            Body for `POST /v1/validate-ocr` with the image in `image` or `image_url`; requires at least one of the two fields.
      properties:
        image:
          type: string
          format: byte
          description: 'Imagen del comprobante codificada en base64. Si también se proporciona `image_url`, solo se considera `image`. Formatos aceptados: JPEG, PNG o WebP. Tamaño máximo: `12 MB`. Dimensiones máximas: `12000px` por lado.'
          x-translations:
            en:
              description: 'Receipt image encoded in base64. If `image_url` is also provided, only `image` is considered. Accepted formats: JPEG, PNG or WebP. Maximum size: `12 MB`. Maximum dimensions: `12000px` per side.'
          example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
        image_url:
          type: string
          format: uri
          description: URL pública (HTTPS) de la imagen del comprobante. La imagen sigue los mismos límites de formato y tamaño que `image` (JPEG, PNG o WebP. Con un máximo de 12 MB).
          example: https://storage.example.com/receipts/comprobante-2025-03.jpg
          x-translations:
            en:
              description: |
                Public HTTP or HTTPS URL of the receipt image. The image is fetched when the request arrives and follows the same format and size limits as `image`: JPEG, PNG, or WebP, up to 12 MB.
        cuenta_beneficiaria:
          type: string
          pattern: ^(\d{10}|\d{16}|\d{18})$
          description: Cuenta receptora de la transferencia (útil cuando falta o está incompleta en la imagen). Requerida para celular DiMo; opcional si la cuenta está guardada como beneficiario. Acepta CLABE (18 dígitos), tarjeta (16 dígitos) o celular DiMo (10 dígitos).
          example: '012180004412345678'
          x-translations:
            en:
              description: Receiving account for the transfer (useful when it is missing or incomplete in the image). Required for DiMo phone; optional if the account is saved as a beneficiary. Accepts CLABE (18 digits), card (16 digits) or DiMo phone (10 digits).
        retry_policy:
          allOf:
            - $ref: '#/components/schemas/RetryPolicy'
          description: Política de reintentos automáticos para esta validación. Si se omite, se aplica la política general del usuario, configurada en `PUT /v1/users/me/retry-policy`. **Los reintentos no consumen cuota de validaciones**.
          x-translations:
            en:
              description: |
                Automatic retry policy for this validation. If omitted, the policy configured at `PUT /v1/users/me/retry-policy` is used. Retries do not consume validation quota.
    RetryStateCompact:
      type: object
      description: |
        Estado resumido del ciclo de reintentos, con la configuración representada como `null`.
      x-translations:
        en:
          description: |
            Summary retry cycle state with configuration represented as `null`.
      properties:
        enabled:
          type: boolean
          description: '`true` cuando existe un ciclo de reintentos activo.'
          example: true
          x-translations:
            en:
              description: '`true` when an active retry cycle exists.'
        max_retries:
          type:
            - integer
            - 'null'
          description: Siempre `null` en esta forma.
          example: null
          x-translations:
            en:
              description: Always `null` in the summary shape.
        interval_seconds:
          type:
            - integer
            - 'null'
          description: Siempre `null` en esta forma.
          example: null
          x-translations:
            en:
              description: Always `null` in the summary shape.
        outcomes:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Siempre `null` en esta forma.
          example: null
          x-translations:
            en:
              description: Always `null` in the summary shape.
        attempts_completed:
          type: integer
          minimum: 0
          description: Cantidad de reintentos completados hasta el momento.
          example: 2
          x-translations:
            en:
              description: Number of retries completed so far.
        next_attempt_at:
          oneOf:
            - $ref: '#/components/schemas/TimestampUTC'
            - type: 'null'
          description: Fecha del próximo reintento; `null` cuando no hay uno programado.
          x-translations:
            en:
              description: |
                Date of the next retry; `null` when none is scheduled.
        resolved_at:
          oneOf:
            - $ref: '#/components/schemas/TimestampUTC'
            - type: 'null'
          description: |
            Fecha en que un reintento obtuvo `valid`; `null` mientras no ocurra.
          x-translations:
            en:
              description: |
                Date when a retry produced `valid`; `null` until that occurs.
        exhausted_at:
          oneOf:
            - $ref: '#/components/schemas/TimestampUTC'
            - type: 'null'
          description: |
            Fecha en que se agotaron los intentos; `null` mientras no ocurra.
          x-translations:
            en:
              description: |
                Date when attempts were exhausted; `null` until that occurs.
        cancelled_at:
          oneOf:
            - $ref: '#/components/schemas/TimestampUTC'
            - type: 'null'
          description: |
            Fecha de cancelación del ciclo; `null` mientras no ocurra.
          x-translations:
            en:
              description: |
                Cycle cancellation date; `null` until that occurs.
        terminal_state:
          type:
            - string
            - 'null'
          enum:
            - pending
            - resolved
            - exhausted
            - cancelled
            - null
          description: 'Situación del ciclo: `pending`, `resolved`, `exhausted` o `cancelled`. Es `null` cuando la validación no tiene un ciclo de reintentos.'
          example: pending
          x-translations:
            en:
              description: |
                Cycle state: `pending`, `resolved`, `exhausted`, or `cancelled`. It is `null` when the validation has no retry cycle.
    PublicValidationListItem:
      type: object
