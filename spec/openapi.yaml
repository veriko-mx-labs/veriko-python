    SendWebhookTestAttributes:
      type: object
      description: 'Resultado de una entrega de prueba: respuesta del receptor, latencia o error.'
      properties:
        delivered:
          type: boolean
          description: '`true` cuando el endpoint webhook receptor respondió con un estado HTTP `2xx` y dentro del tiempo de espera. `false` cuando falla la validación URL, el DNS no resuelve, se agotó el tiempo de espera o respondió con un código fuera del rango `2xx`.'
          x-translations:
            en:
              description: '`true` when the receiver answered with an HTTP `2xx` status within the timeout. `false` when SSRF re-validation fails, DNS does not resolve, the receiver times out, or it answers with a non-`2xx` status code.'
          example: true
        http_status:
          type: integer
          description: 'Código de estado HTTP con el que respondió el endpoint webhook receptor. `0` cuando no hubo respuesta HTTP: DNS, tiempo agotado, o el fallo de la re-validación SSRF antes de la conexión.'
          x-translations:
            en:
              description: HTTP status code the receiver answered with. `0` when no HTTP response was received (DNS, timeout, or SSRF re-validation failure before the connection).
          example: 200
        response_time_ms:
          type: integer
          minimum: 0
          description: Duración del intento de entrega, en milisegundos. Incluye DNS, TLS y el viaje de ida y vuelta.
          x-translations:
            en:
              description: Duration of the delivery attempt, in milliseconds. Includes DNS, TLS, and the roundtrip.
          example: 184
        error:
          type:
            - string
            - 'null'
          description: Detalle del fallo de transporte o de validación de URL. Puede ser `null` aunque `delivered=false` si el receptor respondió con un estado fuera de `2xx` pero la petición se completó.
