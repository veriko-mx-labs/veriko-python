          description: Timestamp del último chequeo de salud ejecutado. `null` cuando aún no se ha ejecutado ningún chequeo.
          example: '2026-04-11T15:30:00Z'
          x-translations:
            en:
              description: Timestamp of the last health check executed. `null` when no check has been run yet.
        estimated_recovery_at:
          oneOf:
            - $ref: '#/components/schemas/TimestampUTC'
            - type: 'null'
          description: Tiempo estimado de recuperación del servicio de verificación de Banxico. Solo se establece para cierto tipo de degradación transitoria con una ventana de recuperación conocida; `null` en cualquier otro caso, incluidos los demás tipos de `degraded`.
          example: null
          x-translations:
            en:
              description: Estimated service recovery time. Only set for a specific kind of transient degradation with a known recovery window; `null` in every other case, including other kinds of `degraded`.
        check_interval_seconds:
          type: integer
          minimum: 1
          description: Cadencia (en segundos) del chequeo de salud automático que alimenta este estado. Se lee en vivo de la tarea programada, así que un cambio surte efecto sin desplegar; cuando no hay ninguna cadencia configurada, son `300`.
