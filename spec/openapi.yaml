          description: 'Bulk beneficiary import job. Lifecycle: `pending` → `parsing` → `preview_ready` → `committing` → `completed` (or `failed` / `cancelled`). Wrapped under `{ type, id, attributes }` following JSON:API format.'
      allOf:
        - $ref: '#/components/schemas/JsonApiResourceBase'
        - type: object
          properties:
            type:
              type: string
              enum:
                - beneficiary_import
              description: Tipo del recurso JSON:API. Siempre `beneficiary_import`.
              example: beneficiary_import
              x-translations:
                en:
                  description: JSON:API resource type. Always `beneficiary_import`.
            id:
              type: string
              description: Identificador numérico del trabajo de importación (expresado como string).
              example: '42'
              x-translations:
                en:
                  description: Numeric job ID expressed as a string (JSON:API format).
            attributes:
              type: object
