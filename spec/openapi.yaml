          x-translations:
            en:
              description: User's active subscription with plan, cycle, and quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionResponse'
              examples:
                stripe_subscription:
                  summary: Suscripción Stripe activa — plan Pro
