                  - type: object
                    properties:
                      data:
                        type: object
                        allOf:
                          - $ref: '#/components/schemas/JsonApiResourceBase'
                          - type: object
                            properties:
                              type:
                                type: string
                                enum:
                                  - user
                              id:
                                type: string
                                format: uuid
                              attributes:
                                $ref: '#/components/schemas/UserMeBundle'
              examples:
                bundle_basic:
                  summary: Información completa sin 2FA activo
                  x-translations:
                    en:
                      summary: Complete information without 2FA enabled
                  value:
                    data:
                      type: user
                      id: b1e4a2c3-1234-4abc-8def-000000000001
                      attributes:
                        id: b1e4a2c3-1234-4abc-8def-000000000001
                        email: carlos@example.com
                        name: Carlos Lopez
                        role: user
                        status: active
                        timezone: America/Mexico_City
                        language: es
                        email_verified_at: '2026-04-30T10:15:00Z'
