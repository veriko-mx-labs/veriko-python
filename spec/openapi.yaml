      x-related:
        - POST /v1/validate
        - POST /v1/beneficiaries
        - GET /v1/validations/{id}
        - GET /v1/validations/{id}/image
      x-translations:
        en:
          summary: Validate a SPEI transfer (OCR)
          description: |-
            Validates a SPEI transfer from the image of its receipt. It extracts the data from the image through optical character recognition (OCR) and validates it against **Banxico** to obtain the transaction's CEP.

            The image is sent as `image` or as `image_url`. When sent as a URL, the target host must serve it over a secure protocol (SSL/HTTPS).

            {% callout type="info" %}
            The `cuenta_beneficiaria` field sends the receiving account of the transfer explicitly, which is especially useful when the image does not carry that data or carries it incomplete.\
            That account can be saved as a beneficiary (with `POST /v1/beneficiaries`) so it does not have to be sent on every validation: the system then detects the visible digits in each image automatically.

            {% /callout %}

            The final verdict is the same as in manual validation:

            - `valid`: The transaction's CEP was found and validated.
            - `not_found`: The transaction's CEP was NOT found.
            - `cep_unavailable`: Banxico recognized the transaction but the CEP is not available for now.
            - `returned`: the transaction was settled and the beneficiary institution later sent it back. The CEP, when there is one, is still delivered.
            - `error`: Internal service error.

            {% callout type="info" %}
            **Asynchronous mode:**\
            With `?async=1` in the URL, the image is checked before the job is accepted and the response is an immediate HTTP status `202` with the validation ID in the body.\
            \
            The verdict is collected by polling `GET /v1/validations/{id}` until a terminal status, as {% concept slug="async-validations" %}asynchronous operations{% /concept %} describes.

            {% /callout %}

            {% callout type="info" %}
            **Idempotency:**\
            The `Idempotency-Key` header is optional and prevents duplicating a validation when a request is repeated. `5xx` responses are not stored, so a server failure does not leave the idempotency key unusable.\
            Reusing the header with a different body causes an HTTP status `422` (with `idempotency_key_reused` in the body).\
            Reusing the header while the previous operation is still in flight causes an HTTP status `409` (with `idempotency_key_in_progress` in the body).

            {% /callout %}

            {% callout type="warning" %}
            **Charging policy (quota):**\
            — Synchronous mode: the validation is charged against the quota when the request is accepted, before the image is checked. That is, an invalid image consumes a validation.\
            — Asynchronous mode: the image is checked first, so an invalid image consumes nothing.\
            \
            Quota is never refunded. Later automatic retries do not consume an additional validation, and the accounting is in {% concept slug="quotas-and-plans" %}quotas and plans{% /concept %}.

            {% /callout %}
