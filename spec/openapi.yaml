        Un rango sin comprobantes responde con un estado HTTP `404 no_ceps`.

        Fechas mal formadas o un `to` anterior al `from`, responden con un estado HTTP `400 invalid_range`.

        {% callout type="info" %}
        Para un solo comprobante está `GET /v1/validations/{id}/cep`, y para el estado de cuenta del mes sin los archivos, `GET /v1/finance/statement`.

        {% /callout %}
