                  value:
                    data:
                      type: usage_summary
                      attributes:
                        plan_slug: basic
                        plan_name: Basic
                        limit: 1000
                        used: 920
                        remaining: 80
                        used_percent: 92
                        tone: danger
                        resets_at: '2025-03-01T00:00:00Z'
                        next_reset_at: '2025-03-01T00:00:00Z'
                    meta:
                      version: 1.51.0
                      request_id: a9b0c1d2e3f4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-translations:
        en:
          summary: Current monthly quota summary
          description: |-
            Returns the validation quota of the plan assigned to the authenticated
            user:

            - The plan limit.
            - The validations consumed.
            - The validations remaining.
            - The percentage of the limit consumed.

            The `tone` field signals the alert level by that percentage: `ok` below
            70%, `warn` between 70% and 89%, and `danger` from 90% or with the quota
            exhausted.

            `limit` is the active plan's, returned by
            [`GET /v1/billing/subscription`](/en/v1/billing/billing-get-subscription),
            and the reset timestamp (`resets_at`) is the end of the quota cycle: it
            matches that subscription's `current_period_end` except on an annual
            plan, where quota resets every month. `next_reset_at` is an alias of
            `resets_at`: both mark the end of the current quota cycle.

            Rate limits — which are not quota — are returned by [`GET
            /v1/usage/limits`](/en/v1/usage/get-usage-limits).
      security:
        - ApiKeyAuth: []
