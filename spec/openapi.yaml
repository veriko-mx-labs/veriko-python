openapi: 3.1.0
info:
  title: Veriko API
  description: |-
    REST API para validar transferencias SPEI mexicanas contra Banxico CEP. Soporta validación manual por campos, validación por OCR de comprobantes, importación masiva (CSV/XLSX/imágenes), gestión de beneficiarios, métricas de uso, finanzas y notificaciones.

    Las respuestas de error incluyen `error.detail` traducible. La cabecera `Accept-Language: es` o `Accept-Language: en` permite negociar el idioma; `error.code` es el contrato estable y NO se traduce.

    Todas las fechas se emiten en UTC; cada respuesta lo confirma en `meta.datetime`.

    Las integraciones programáticas se autentican mediante una clave de API (`Authorization: Bearer veriko_…`).
  version: 1.60.0
  contact:
    name: Veriko Support
    email: soporte@veriko.mx
  license:
    name: Proprietary
  x-translations:
    en:
      title: Veriko API
      description: |-
        REST API to validate Mexican SPEI bank transfers against Banxico CEP. Supports field-based manual validation, OCR receipt validation, bulk import (CSV/XLSX/images), beneficiary management, usage metrics, finance and notifications.

        Error responses carry a translatable `error.detail`. The `Accept-Language: es` or `Accept-Language: en` header negotiates the language; `error.code` is the stable contract and is NOT translated.

        All datetimes are emitted in UTC; each response confirms it in `meta.datetime`.

        Programmatic integrations authenticate with an API key (`Authorization: Bearer veriko_…`).
servers:
  - url: https://api.veriko.mx/v1
    description: Production — programmatic access via API key
    x-translations:
      en:
        description: Production — programmatic access via API key
security:
