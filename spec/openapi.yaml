  /beneficiaries/imports:
    post:
      tags:
        - Beneficiaries
      summary: Iniciar importación masiva de beneficiarios
      description: |-
        Sube un archivo (CSV, XLS, XLSX, TXT o PDF) de hasta 20 MB y abre con él un trabajo de importación.

        El modo de lectura decide cuánto trabajo hace el archivo y cuánto el servidor:

        - `template`: el archivo respeta los encabezados canónicos, que se obtienen de `/v1/beneficiaries/imports/template`. El banco se deriva del prefijo de la CLABE o del BIN de la tarjeta.
        - `free`: cualquier formato. Las cuentas se extraen del contenido, con apoyo de un LLM cuando el archivo no tiene estructura reconocible.

        **La importación no persiste nada por sí sola.** Queda a la espera de una confirmación explícita. La secuencia completa son cuatro pasos:

        1. Esta llamada (`POST /v1/beneficiaries/imports`) devuelve el identificador del trabajo.
        2. `GET /v1/beneficiaries/imports/{id}` informa del avance hasta `preview_ready` o `failed`.
        3. `GET /v1/beneficiaries/imports/{id}/preview` muestra las filas extraídas, y `PATCH /v1/beneficiaries/imports/{id}/rows/{row_id}` corrige las que hagan falta.
        4. `POST /v1/beneficiaries/imports/{id}/commit` persiste el resultado.

        El sondeo del paso 2 y su cadencia están descritos en {% concept slug="async-validations" %}las operaciones asíncronas{% /concept %}.

        {% callout type="warning" %}
        Solo puede haber un trabajo abierto a la vez: una segunda subida mientras la anterior sigue viva responde con un estado HTTP `422` (con `import_already_in_flight` en el cuerpo).

        {% /callout %}
      operationId: createBeneficiaryImport
      externalDocs:
        url: https://docs.veriko.mx/how-to/beneficiary-import
        description: 'How-to: importación masiva de beneficiarios'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateBeneficiaryImportRequest'
            encoding:
              file:
                contentType: text/csv, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/plain, application/pdf
              parse_mode:
                contentType: text/plain
      x-codeSamples:
        - lang: curl
          label: Shell
          source: |-
            curl -X POST 'https://api.veriko.mx/v1/beneficiaries/imports' \
              -H 'Authorization: Bearer veriko_••••' \
              -H 'Content-Type: application/json'
      responses:
        '202':
          description: Trabajo de importación creado y esperando procesamiento.
          x-translations:
            en:
              description: Import job created and enqueued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBeneficiaryImportResponse'
              example:
                data:
                  type: beneficiary_import
                  id: '42'
                  attributes:
                    status: pending
                meta:
                  version: 1.47.0
                  api_version: v1
                  request_id: e1f2a3b4c5d6
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: 'Falló la validación o la pre-condición. Códigos posibles: `file_required`, `file_too_large`, `unsupported_format` e `import_already_in_flight`.'
          x-translations:
            en:
              description: 'Validation or pre-condition failed. Possible codes: `file_required`, `file_too_large`, `unsupported_format`, and `import_already_in_flight`.'
              example:
                errors:
                  - detail: A `file` part is required in the multipart body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - status: '422'
                    code: file_required
                    detail: Falta la parte `file` en el cuerpo multiparte.
                meta:
                  version: 1.47.0
                  api_version: v1
                  request_id: f2a3b4c5d6e7
      x-related:
        - GET /v1/beneficiaries/imports/{id}
        - GET /v1/beneficiaries/imports/{id}/preview
        - POST /v1/beneficiaries/imports/{id}/commit
        - DELETE /v1/beneficiaries/imports/{id}
        - GET /v1/beneficiaries/imports/template
      x-translations:
        en:
          summary: Start a bulk beneficiary import
          description: |-
            Uploads a file — CSV, XLS, XLSX, TXT, or PDF, up to 20 MB — and opens an
            import job with it. The reading mode decides how much work the file does
            and how much the server does:

            - `template`: the file follows the canonical headers, obtained from
              `/v1/beneficiaries/imports/template`. The bank is derived from the CLABE
              prefix or the card BIN.
            - `free`: any format. Accounts are extracted from the content, with a
              language model stepping in when the file has no recognisable structure.

            **The import persists nothing on its own.** It waits for an explicit
            confirmation. The full sequence is four steps:

            1. This call (`POST /v1/beneficiaries/imports`) returns the job identifier.
            2. `GET /v1/beneficiaries/imports/{id}` reports progress until
               `preview_ready` or `failed`.
            3. `GET /v1/beneficiaries/imports/{id}/preview` shows the extracted rows,
               and `PATCH /v1/beneficiaries/imports/{id}/rows/{row_id}` corrects the
               ones that need it.
            4. `POST /v1/beneficiaries/imports/{id}/commit` persists the result.

            The polling in step 2 and its cadence are described in
            {% concept slug="async-validations" %}asynchronous operations{% /concept %}.

            {% callout type="warning" %}
            Only one job may be open at a time: a second upload while the previous one
            is still alive responds with HTTP status `422`, with
            `import_already_in_flight` in the body.
            {% /callout %}
      security:
        - ApiKeyAuth: []
