  /validations/{id}/retry-policy:
    put:
      x-related:
        - DELETE /v1/validations/{id}
        - GET /v1/validations/{id}
        - GET /v1/validations/{id}/cep
        - GET /v1/validations/{id}/image
        - GET /v1/validations/{id}/retry-attempts
        - POST /v1/validations/{id}/cancel-retries
      tags:
        - Validations
      summary: Configurar política de reintentos
      description: |-
        Activa una política de reintentos automáticos para una validación con veredicto `not_found`, `cep_unavailable` o `error`.

        Este tipo de veredictos pueden aparecer cuando la operación aún NO es procesada por Banxico, de tal modo que el sistema puede re-validar la transferencia en automático tras un periodo de tiempo establecido.

        {% callout type="warning" %}
        **No se admite en tres casos:**\
        — Validaciones que llegaron por importación masiva.\
        — Validaciones ya resueltas.\
        — Validaciones fuera de la antigüedad que permite el plan.

        {% /callout %}

        Un ciclo de reintentos puede devolver `terminal_state="exhausted"` cuando se alcanzan el máximo de reintentos configurado. También puede devolver `terminal_state="cancelled"` cuando el usuario cancela manualmente los reintentos de la validación.

        En ambos casos, el ciclo puede reactivarse mientras conserve reintentos disponibles.

        El estado completo de una validación se obtiene con `GET /v1/validations/{id}`, y los límites están descritos en {% concept slug="retry-policy" %}la política de reintentos{% /concept %}.
      operationId: updateValidationRetryPolicy
      externalDocs:
        url: https://docs.veriko.mx/how-to/inspect-validations
        description: Browse and manage validation records
      parameters:
        - $ref: '#/components/parameters/ValidationId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateValidationRetryPolicyRequest'
            examples:
              activate_basic:
                summary: Activar reintentos — 3 intentos cada 10 min
                x-translations:
                  en:
                    summary: Activate retries — 3 attempts every 10 min
                value:
                  retry_policy:
                    enabled: true
                    max_retries: 3
                    interval_seconds: 600
                    outcomes:
                      - not_found
                      - cep_unavailable
              activate_cep_only:
                summary: Reintentos solo para cep_unavailable — 5 intentos cada 5 min
                x-translations:
                  en:
                    summary: Retries for cep_unavailable only — 5 attempts every 5 min
                value:
                  retry_policy:
                    enabled: true
                    max_retries: 5
                    interval_seconds: 300
                    outcomes:
                      - cep_unavailable
              activate_for_error:
                summary: Reintentos amplios — incluye fallos transitorios Banxico
                x-translations:
                  en:
                    summary: Broad retries — includes transient Banxico failures
                value:
                  retry_policy:
                    enabled: true
                    max_retries: 3
                    interval_seconds: 600
                    outcomes:
                      - not_found
                      - cep_unavailable
      x-codeSamples:
        - lang: curl
          label: Shell
          source: |-
            curl -X PUT 'https://api.veriko.mx/v1/validations/{id}/retry-policy' \
              -H 'Authorization: Bearer veriko_••••' \
              -H 'Content-Type: application/json' \
              -d '{
                "retry_policy": {
                  "enabled": true,
                  "max_retries": 3,
                  "interval_seconds": 600,
                  "outcomes": [
                    "not_found",
                    "cep_unavailable"
                  ]
                }
              }'
      responses:
        '200':
          description: Política de reintentos activada. Devuelve el estado actual completo del ciclo.
          x-translations:
            en:
              description: Retry policy activated. Returns the full current state of the retry cycle.
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum:
                  - 'true'
                  - 'false'
              description: Solo está presente cuando la petición incluyó `Idempotency-Key`. `true` indica que la respuesta se reutilizó desde el caché de idempotencia, cuya vigencia es de 24 horas por cuenta, endpoint y clave.
              x-translations:
                en:
                  description: Only present when the request included `Idempotency-Key`. `true` marks a response reused from the idempotency cache, which remains valid for 24 hours per account, endpoint, and key.
          content:
