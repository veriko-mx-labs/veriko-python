          x-translations:
            en:
              description: |
                Outcomes that trigger a retry. By default, they are `not_found`, `cep_unavailable`, and `error`; the combination `["not_found", "cep_unavailable"]` excludes `error`.
    ValidationRequest:
      type: object
      required:
        - fecha
        - monto
      anyOf:
        - required:
            - clave_rastreo
        - required:
            - referencia_numerica
      description: |
        Cuerpo de `POST /v1/validate` para una validación manual SPEI; exige `clave_rastreo` o `referencia_numerica`.
      x-translations:
        en:
          description: |
            Body for `POST /v1/validate` for a manual SPEI validation; requires `clave_rastreo` or `referencia_numerica`.
      properties:
        fecha:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          minLength: 10
          maxLength: 10
          description: Fecha de la transferencia en formato ISO 8601 (YYYY-MM-DD).
          example: '2025-03-15'
          x-translations:
            en:
              description: Transfer date in ISO 8601 format (YYYY-MM-DD).
          x-invalid-examples:
            - 15/03/2025
            - 2025-3-15
            - '20250315'
        monto:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Importe de la transferencia (en pesos mexicanos — MXN), mayor que cero y con hasta dos decimales. No se acepta en notación científica (por ejemplo `1e-5`) cuando se envía como texto.
          example: 15000.5
          x-translations:
            en:
              description: Transfer amount in Mexican pesos (MXN), greater than zero and with up to two decimal places. Scientific notation (e.g. `1e-5`) is rejected when sent as text.
          x-invalid-examples:
            - 0
            - -100
            - '1e-5'
        clave_rastreo:
          type: string
          minLength: 1
          maxLength: 30
          description: Clave de rastreo de la transferencia (entre 1 a 30 caracteres). Acepta letras, números, guiones, diagonales y espacios. Se recorta y se le quitan caracteres invisibles de ancho cero antes de validarse, para que la misma clave copiada y pegada compare igual en toda la plataforma. Requerida si `referencia_numerica` no es enviada; ambas pueden incluirse simultáneamente para mayor precisión de búsqueda.
          example: MXBA20250315001234
          x-translations:
            en:
              description: Transfer tracking key, between 1 and 30 characters. Accepts letters, numbers, hyphens, slashes, and spaces. It is trimmed and stripped of zero-width invisible characters before validation, so the same copy-pasted key compares equal everywhere in the platform. Required when `referencia_numerica` is not sent; both can be included for a more precise search.
          x-invalid-examples:
            - ''
            - MXBA202503150012345678901234567890
            - MXBA<2025>0315
        referencia_numerica:
          type: string
          minLength: 1
          pattern: '^(?: *\d){1,7} *$'
          description: Referencia numérica de la transferencia (entre 1 y 7 dígitos). Acepta solo números y espacios. Requerida si `clave_rastreo` no es enviada; ambas pueden incluirse simultáneamente para mayor precisión de búsqueda.
          example: '1234567'
          x-translations:
            en:
              description: Numeric transfer reference, between 1 and 7 digits. Accepts only numbers and spaces. Required when `clave_rastreo` is not sent; both can be included for a more precise search.
          x-invalid-examples:
            - '12345678'
            - ABC1234
        emisor:
          type: string
          maxLength: 255
          description: '**Nombre o código SPEI** del banco emisor. Cuando falta o es incorrecto, la clave de rastreo puede aportarlo. Si aun así no puede resolverse, la respuesta es un estado HTTP `422`.'
          example: BANCO NACIONAL DE MEXICO
          x-translations:
            en:
              description: '**SPEI name or code** of the sending bank. When it is missing or incorrect, the tracking key may provide it. If it still cannot be resolved, the response is an HTTP status `422`.'
        receptor:
          type: string
          maxLength: 255
          description: '**Nombre / código SPEI** del banco receptor. Es opcional cuando el banco puede identificarse a partir de `cuenta_beneficiaria`. Si no puede resolverse, la respuesta será un estado HTTP `422`.'
          example: BBVA MEXICO
          x-translations:
            en:
              description: '**SPEI name / code** of the receiving bank. Optional when the bank can be identified from `cuenta_beneficiaria`. If it cannot be resolved, the response is HTTP status `422`.'
        cuenta_beneficiaria:
          type: string
          pattern: ^(\d{10}|\d{16}|\d{18})$
          description: Cuenta bancaria receptora de la transferencia. Puede ser CLABE (18 dígitos), tarjeta (16 dígitos) o celular DiMo (10 dígitos), y el tipo se identifica por la longitud de sus dígitos. Los espacios y guiones que separan grupos ("0121 8000 4412 345678") se ignoran automáticamente antes de contar la longitud. Para celular DiMo, si el banco receptor no puede resolverse por el campo `receptor`, por los beneficiarios registrados ni por el directorio de cuentas, la respuesta es un estado HTTP `422` (con `bank_code_unresolvable_for_phone` en el cuerpo).
          example: '012180004412345678'
          x-translations:
            en:
              description: Receiving bank account for the transfer. It can be a CLABE (18 digits), a card (16 digits) or a DiMo phone (10 digits), and the type is identified by the length of its digits. Spaces and hyphens separating groups ("0121 8000 4412 345678") are stripped automatically before the length is counted. For a DiMo phone, if the receiving bank cannot be resolved through the `receptor` field, through the registered beneficiaries or through the account directory, the response is an HTTP status `422` (with `bank_code_unresolvable_for_phone` in the body).
          x-invalid-examples:
            - '12345678'
            - '1234567890123456789012'
            - ABCDEFGHIJKLMNOPQR
        receptor_participante:
          type: integer
          enum:
            - 0
            - 1
          default: 0
          description: 'Indica si el beneficiario de la transferencia es directamente la institución receptora del pago («Pago a Banco» en el CEP de Banxico) y no uno de sus cuentahabientes. `0` para una transferencia a un cuentahabiente (valor por defecto); `1` para pagos cuyo beneficiario es el banco —pago de tarjeta de crédito, de crédito o de servicios a la propia institución. Opcional: si se omite se asume `0`.'
          example: 0
          x-translations:
            en:
              description: 'Whether the transfer beneficiary is the receiving institution itself («Pago a Banco» in the Banxico CEP) rather than one of its account holders. `0` for a transfer to an account holder (the default); `1` for payments whose beneficiary is the bank —credit card, loan, or services paid to the institution itself. Optional: omitted means `0`.'
          x-invalid-examples:
            - 2
            - -1
            - true
        retry_policy:
          allOf:
            - $ref: '#/components/schemas/RetryPolicy'
          description: Política de **reintentos automáticos** para esta validación. Si se omite, se aplica la política general configurada para el usuario. Los reintentos NO consumen cuota de validaciones.
          x-translations:
            en:
              description: '**Automatic retry** policy for this validation. If omitted, the general policy configured for the user is applied. Retries do NOT consume validation quota.'
