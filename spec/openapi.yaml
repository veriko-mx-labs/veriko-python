                            enum:
                              - usage_summary
                          attributes:
                            $ref: '#/components/schemas/UsageSummary'
              examples:
                normal_usage:
                  summary: Uso normal — tono ok (42 % consumido)
                  x-translations:
                    en:
                      summary: Normal usage — ok tone (42% consumed)
                  value:
                    data:
                      type: usage_summary
                      attributes:
                        plan_slug: basic
                        plan_name: Basic
                        limit: 1000
                        used: 420
                        remaining: 580
                        used_percent: 42
                        tone: ok
                        resets_at: '2025-03-01T00:00:00Z'
                        next_reset_at: '2025-03-01T00:00:00Z'
                    meta:
                      version: 1.51.0
                      request_id: f8a9b0c1d2e3
                near_limit:
