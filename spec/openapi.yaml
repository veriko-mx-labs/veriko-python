                  x-translations:
                    en:
                      summary: Banxico validation service degraded — slow responses
                  value:
                    data:
                      type: banxico_status
                      id: current
                      attributes:
                        status: degraded
                        status_label: Degradado
                        message: Las verificaciones están respondiendo más lento de lo habitual.
                        last_verified_at: '2026-04-11T16:00:00Z'
                        estimated_recovery_at: '2026-04-11T17:00:00Z'
                    meta:
                      version: 1.47.0
                      api_version: v1
                      request_id: b2c3d4e5f6a7
                down:
                  summary: Servicio de verificación de Banxico inaccesible
                  x-translations:
                    en:
                      summary: Banxico validation service unreachable
                  value:
                    data:
                      type: banxico_status
                      id: current
                      attributes:
                        status: down
