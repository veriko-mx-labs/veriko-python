            en:
              description: '`true` when the retry cycle is active. With `false`, the other fields are ignored.'
        max_retries:
          type: integer
          minimum: 1
          description: Número máximo de reintentos automáticos. Una vez alcanzado, el ciclo pasa al estado terminal `exhausted`.
          example: 3
          x-translations:
            en:
              description: |
                Maximum number of automatic retries. Once reached, the cycle enters the `exhausted` terminal state. The allowed limit depends on the plan.
        interval_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          description: 'Segundos de espera entre cada reintento. Valores válidos: 300–86400 (5 min a 24h).'
