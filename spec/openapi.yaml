                Top 5 user beneficiary accounts by verified volume in the month.
          items:
            type: object
            description: Resumen de una cuenta contraparte con volumen verificado del periodo.
            x-translations:
              en:
                description: Counterparty account summary with verified volume for the period.
            properties:
              cuenta:
                type: string
                description: Cuenta beneficiaria (CLABE, tarjeta o celular).
                example: '012345678901234567'
                x-translations:
                  en:
                    description: Beneficiary account (CLABE, card, or phone number).
              banco:
                type: string
                description: Nombre del banco receptor, tal como quedó en la validación.
                example: BBVA México
                x-translations:
                  en:
                    description: Name of the receiving bank, as recorded in the validation.
              count:
                type: integer
                description: Cantidad de transferencias a esta cuenta en el mes.
                example: 24
                x-translations:
                  en:
                    description: Number of transfers to this account in the month.
              valid:
                type: integer
                description: Cuántas de ellas encontraron el comprobante y cuadran.
                example: 22
                x-translations:
                  en:
                    description: How many of them found the receipt and match.
              verified_volume:
                type: number
                description: Importe sumado en MXN de las transferencias que cuadran.
                example: 145000
                x-translations:
                  en:
                    description: Summed amount in MXN of the transfers that match.
        top_banks_receptor:
          type: array
          description: Top 5 bancos receptores por volumen verificado.
          x-translations:
            en:
              description: Top 5 receiving banks by verified volume.
          items:
            $ref: '#/components/schemas/FinanceTopBank'
        top_banks_emisor:
          type: array
          description: Top 5 bancos emisores por volumen verificado.
          x-translations:
            en:
              description: Top 5 sending banks by verified volume.
          items:
            $ref: '#/components/schemas/FinanceTopBank'
        verdict_distribution:
          type: object
          description: Conteo de validaciones por valor de veredicto. Los valores ausentes implican cero.
          x-translations:
            en:
              description: Validation count by verdict value. Missing values imply zero.
          additionalProperties:
            type: integer
          example:
            valid: 228
            not_found: 32
            cep_unavailable: 18
            invalid: 4
            returned: 4
            error: 3
        comparison_prev_month:
          type: object
          description: |
            Comparativa contra el mes anterior. Los deltas son `null` cuando el mes anterior tuvo base cero (crecimiento no definido).
          x-translations:
            en:
              description: |
                Comparison against the previous month. Deltas are `null` when the previous month had a zero base (growth not defined).
          properties:
            prev_month:
              type: string
              pattern: ^\d{4}-\d{2}$
              description: Mes anterior en formato `YYYY-MM`.
              example: 2026-03
              x-translations:
                en:
                  description: Previous month in `YYYY-MM` format.
            total:
              type: integer
              description: Cantidad de validaciones del mes anterior.
              example: 251
              x-translations:
                en:
                  description: Number of validations in the previous month.
            verified_volume:
              type: number
              description: Volumen verificado del mes anterior en MXN.
              example: 880000
              x-translations:
                en:
                  description: Verified volume in the previous month in MXN.
            total_delta_pct:
              type:
                - number
                - 'null'
              description: |
                Cambio porcentual del conteo total respecto al mes anterior. `null` cuando el mes anterior tuvo cero validaciones.
              example: 14.3
              x-translations:
                en:
                  description: |
                    Percentage change in total count vs. the previous month. `null` when the previous month had zero validations.
            volume_delta_pct:
              type:
                - number
                - 'null'
              description: |
                Cambio porcentual del volumen verificado respecto al mes anterior. `null` cuando el mes anterior tuvo cero volumen verificado.
              example: 11.4
              x-translations:
                en:
                  description: |
                    Percentage change in verified volume vs. the previous month. `null` when the previous month had zero verified volume.
        folio:
          type: string
          description: |
            Folio determinístico del estado de cuenta del mes, idéntico al devuelto en la cabecera `X-Finance-Folio` del endpoint de exportación.
          example: A3F12B9C0D4E
          x-translations:
            en:
              description: |
                Deterministic statement folio for the month, identical to the value returned in the `X-Finance-Folio` header of the export endpoint.
    FinanceSummaryResource:
