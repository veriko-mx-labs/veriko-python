              x-translations:
                en:
                  description: API resource type (`bin_lookup` by default).
            id:
              type: string
              pattern: ^\d{6,8}$
              minLength: 6
              maxLength: 8
              description: BIN (6-8 dígitos) que coincidió en la búsqueda.
              example: '45320151'
              x-translations:
