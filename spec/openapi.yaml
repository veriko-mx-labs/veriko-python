components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key para acceso programático (M2M). Envía la cabecera `Authorization: Bearer veriko_<64 hex>`. Las API keys se generan en el dashboard del usuario.'
      x-translations:
        en:
          description: 'API key for programmatic (M2M) access. Send `Authorization: Bearer veriko_<64 hex>`. API keys are minted from the user dashboard.'
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_\-]{1,255}$
        example: 11111111-2222-3333-4444-555555555555
      description: 'Llave opcional que garantiza que la petición se procese **exactamente una vez** dentro de un TTL de 24 horas. Los reintentos con la misma llave y el mismo cuerpo devuelven la respuesta cacheada con la cabecera `Idempotent-Replayed: true` (sin re-disparar webhooks) y sin crear una nueva validación.'
      x-translations:
        en:
          description: |
            Optional client-generated key (Stripe-style) that guarantees the request is processed **exactly once** within a 24-hour TTL. The scope is `(user_id, endpoint, key)`. Retries with the same key and the same body return the byte-for-byte cached response with the `Idempotent-Replayed: true` header, without consuming rate-limit quota, without re-firing webhooks, and without creating a new `validations` row. Same key with a different body → 422 `idempotency_key_reused`. Same key with an in-flight request → 409 `idempotency_key_in_progress`. 5xx responses are not cached (retries with the same key are processed for real). Format: 1–255 characters, alphanumeric + `_` + `-`.
    AsyncQueryParam:
      name: async
      in: query
      required: false
      schema:
        type: string
        enum:
          - '0'
          - '1'
          - 'true'
          - 'false'
          - 'yes'
        default: '0'
      description: 'Cuando es `1`/`true`/`yes`: Procesa la validación en segundo plano y responde un estado HTTP 202 inmediato con `validation_id`. Sin el flag o con `0`, la respuesta es síncrona y devuelve el resultado final.'
      x-translations:
        en:
          description: |
            When `1`/`true`/`yes`, the validation is queued and the server responds 202 immediately with a `validation_id`; the client polls `GET /v1/validations/{id}` until the terminal state. Without the flag or with `0`, the response is synchronous and returns the final result in the same POST.
    ValidationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificador (UUID) de la validación
      x-translations:
        en:
          description: Validation UUID.
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        example: W/"3-processing"
      description: '**ETag** recibido en peticiones anteriores. Si los datos no han cambiado y el `etag_version` sigue igual, el server responde `304 Not Modified` (sin cuerpo) — evita recibir los datos de nuevo cuando el estado del recurso NO ha cambiado.'
      x-translations:
        en:
          description: '**ETag** received in previous requests. If the data has not changed and `etag_version` is still the same, the server responds `304 Not Modified` (no body) — avoids receiving the data again when the resource state has NOT changed.'
  schemas:
    ErrorObject:
      type: object
      description: 'Un error individual: el código estable por el que ramifica el cliente, el mensaje legible —ese sí traducido—, el estado HTTP y, cuando el fallo es de un campo concreto, el puntero que lo señala.'
      x-translations:
        en:
          description: 'A single error: the stable code the client branches on, the human-readable message — that one translated —, the HTTP status, and, when the failure is about one field, the pointer naming it.'
      properties:
        status:
          type: string
          pattern: ^[1-5]\d\d$
          description: Código de estado HTTP como string.
          example: '422'
          x-translations:
            en:
              description: HTTP status code as a string.
        code:
          type: string
          description: |
            Código de error estable legible por máquina (contrato). No se traduce. Los clientes deben ramificar por este campo.
          example: validation_error
          x-translations:
            en:
              description: |
                Stable, machine-readable error code (contract). Never translated. Clients must branch on this field.
        detail:
          type: string
          description: |
            Mensaje de error legible por humanos. Traducido según `Accept-Language` (`es` / `en`).
          example: El campo fecha es obligatorio.
          x-translations:
            en:
              description: |
                Human-readable error message. Translated per `Accept-Language` (`es` / `en`).
        source:
          type: object
          description: Origen estructurado del error (JSON Pointer al campo que falló).
          x-translations:
            en:
              description: Structured source of the error (JSON Pointer to the failing field).
          properties:
            pointer:
              type: string
              description: |
                JSON Pointer (RFC 6901) al campo que causó el error (ej. `/data/attributes/fecha`).
              example: /data/attributes/fecha
              x-translations:
                en:
                  description: |
                    JSON Pointer (RFC 6901) to the field that caused the error (e.g. `/data/attributes/fecha`).
      required:
        - status
        - code
        - detail
    DatetimeMeta:
      type: object
      description: |
        Descriptor compañero presente en el bloque `meta` de cada respuesta (y en el
        `meta` del cuerpo de los webhooks salientes). Permite a los clientes afirmar
        el contrato de zona horaria sin releer el spec.
      required:
        - timezone
        - format
      properties:
        timezone:
          type: string
          enum:
            - UTC
          description: 'Siempre `UTC`: La zona canónica para cada campo datetime del cuerpo.'
          x-translations:
            en:
              description: 'Always `UTC`: The canonical timezone for every datetime field in the body.'
          example: UTC
        format:
          type: string
          enum:
            - ISO 8601
          description: 'Siempre `ISO 8601`: Sufijo `Z` explícito en cada datetime.'
          x-translations:
            en:
              description: 'Always `ISO 8601`: Explicit `Z` suffix on every datetime.'
          example: ISO 8601
      example:
        timezone: UTC
        format: ISO 8601
      x-translations:
        en:
          description: |
            Companion descriptor present in the `meta` block of every response (and in
            the `meta` of outgoing webhook bodies). Lets clients assert the timezone
            contract without re-reading the spec.
    ErrorResponse:
      type: object
      description: |
        Wrapper estándar de respuesta de error. El campo `code` dentro de cada error es el contrato estable legible por máquina — los clientes deben ramificar por `code`, no por `detail`.
      x-translations:
        en:
          description: |
            Standard error response wrapper. The `code` field within each error is the stable, machine-readable contract — clients must branch on `code`, not `detail`.
      required:
        - errors
        - meta
      properties:
        errors:
          type: array
          minItems: 1
          description: |
            Lista de uno o más errores ocurridos durante la petición. Cada elemento incluye `status`, `code`, `detail` y, opcionalmente, `source.pointer` apuntando al campo que falló.
          x-translations:
            en:
              description: |
                List of one or more errors that occurred during the request. Each entry includes `status`, `code`, `detail` and, optionally, `source.pointer` referencing the field that failed.
          items:
            $ref: '#/components/schemas/ErrorObject'
        meta:
          type: object
          description: |
            Metadatos de la respuesta, incluyendo versión de la API, prefijo de ruta, identificador único de la petición y marca temporal del servidor en UTC.
          x-translations:
            en:
              description: |
                Response metadata including API version, route prefix, unique request identifier, and the server timestamp in UTC.
          properties:
            version:
              type: string
              pattern: ^\d+\.\d+\.\d+$
              description: Versión de la API que procesó la petición.
              example: 1.47.0
              x-translations:
                en:
                  description: API version that processed the request.
            api_version:
              type: string
              description: Versión del prefijo de ruta de la API (ej. `v1`).
              example: v1
              x-translations:
                en:
                  description: API route prefix version (e.g. `v1`).
            request_id:
              type: string
              description: Identificador único de la petición (hex).
              example: a1b2c3d4e5f6
              x-translations:
                en:
                  description: Unique request identifier (hex).
            datetime:
              $ref: '#/components/schemas/DatetimeMeta'
            validation_id:
              type: string
              format: uuid
              description: |
                Identificador de la validación que se creó antes de fallar. Sólo aparece en errores de `POST /v1/validate` y `POST /v1/validate-ocr` cuando la validación ya quedó registrada con estado `failed` o `error`; consúltala con `GET /v1/validations/{id}` para ver el motivo y lo que se leyó.
              example: 74fa884a-2bdb-4d9d-b36f-3a2def754984
              x-translations:
                en:
                  description: |
                    Identifier of the validation that was created before failing. Only present on `POST /v1/validate` and `POST /v1/validate-ocr` errors when the validation was already recorded with status `failed` or `error`; fetch it with `GET /v1/validations/{id}` to see the reason and what was read.
    Error:
      type: object
      description: |
        Respuesta de error estilo JSON:API. El campo `code` es el contrato estable legible por máquina y nunca se traduce — los clientes deben ramificar por `code`, no por `detail`. El campo `detail` es legible por humanos y se traduce según la cabecera `Accept-Language` de la petición.
      x-translations:
        en:
          description: |
            JSON:API-style error response. The `code` field is the stable, machine-readable contract and is never translated — clients must branch on `code`, not `detail`. The `detail` field is human-readable and translated per the `Accept-Language` request header.
      properties:
        errors:
          type: array
          minItems: 1
          description: |
            Lista de uno o más errores ocurridos durante la petición. Cada elemento incluye `status`, `code`, `detail` y, opcionalmente, `source.pointer` apuntando al campo que falló.
          x-translations:
            en:
              description: |
                List of one or more errors that occurred during the request. Each entry includes `status`, `code`, `detail` and, optionally, `source.pointer` referencing the field that failed.
          items:
            $ref: '#/components/schemas/ErrorObject'
        meta:
          type: object
          description: |
