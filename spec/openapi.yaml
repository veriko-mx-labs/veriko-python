        en:
          summary: Configure retry policy
          description: |-
            Activates an automatic retry policy for a validation with a `not_found`, `cep_unavailable` or `error` verdict.

            Verdicts of that kind can appear while the operation has NOT yet been processed by Banxico, so the system can re-validate the transfer automatically after a set period.

            {% callout type="warning" %}
            **Not admitted in three cases:**\
            — Validations that arrived through a bulk import.\
            — Validations already resolved.\
            — Validations older than the age the plan allows.

            {% /callout %}

            A retry cycle can return `terminal_state="exhausted"` when the configured maximum number of retries is reached. It can also return `terminal_state="cancelled"` when the user cancels the validation's retries manually.

            In both cases the cycle can be reactivated while it keeps retries available.

