paths:
  /users/me:
    get:
      x-related:
        - GET /v1/users/me/retry-policy
        - PUT /v1/users/me/retry-policy
      tags:
        - Users
      summary: Obtener la información de una cuenta de usuario
      description: |-
        Devuelve en una sola llamada todos los datos recabados del usuario
        autenticado:

        - **Perfil**: identificador, correo electrónico, nombre, rol, estado, zona
          horaria e idioma.
        - **Datos de la clave de API**: el prefijo y los últimos 4 caracteres, nunca
          la clave.
        - **Datos de la suscripción**: el plan, el estado y el fin del periodo en
          curso.
        - **Estado de la autenticación de 2 factores (2FA)**.
        - **Permisos del rol**: como lista plana de pares `resource:action`.
        - **Resumen de notificaciones**: notificaciones sin leer, envío push y
          vínculo con Telegram.

        Los campos de perfil que solo tienen sentido en una sesión interactiva —el
        teléfono, el último acceso— se quedan fuera y los sirve
        `GET /v1/users/me/profile-detail`.

        {% callout type="info" %}
        Cuando alguna de esas piezas no se puede calcular, la respuesta llega con el
        resto y añade `_warnings` con el nombre de la pieza que falta.

        {% /callout %}
      operationId: myProfile
      x-codeSamples:
        - lang: curl
          label: Shell
          source: |-
            curl -X GET 'https://api.veriko.mx/v1/users/me' \
              -H 'Authorization: Bearer veriko_••••'
      responses:
        '200':
          description: Información completa del usuario autenticado.
