  /status/banxico:
    get:
      x-related:
        - GET /v1/status/banxico/timeseries
      tags:
        - Banxico Status
      summary: Consultar el estado del servicio de verificación de Banxico
      description: |-
        Devuelve el estado operativo actual del **servicio de verificación de
        Banxico**, derivado de chequeos periódicos de salud.

        El estado puede ser:

        - `operational`: Todos los chequeos pasan y la latencia es normal.
        - `degraded`: Problemas parciales — latencia elevada o errores
          intermitentes.
        - `down`: El servicio es por el momento inaccesible.
        - `unknown`: Aún no hay datos de chequeos de salud disponibles.

        La respuesta se cachea 60 segundos en el cliente con `Cache-Control`, y ese
        plazo se configura en el despliegue. Cualquier usuario autenticado puede
        consultarlo, y no hace falta ningún permiso concreto.

        {% callout type="info" %}
        **Validaciones síncronas durante una interrupción:**\
        Cuando el estado es `degraded` o `down`, las validaciones síncronas pueden
        responder con un estado HTTP `503` (con `banxico_rate_limit_exhausted` en el
        cuerpo). Configura `PUT /v1/validations/{id}/retry-policy` para reintentar
        automáticamente cuando el servicio de verificación de Banxico vuelva a estar
        disponible.

        {% /callout %}
      operationId: banxicoPublicStatus
      x-codeSamples:
        - lang: curl
          label: Shell
          source: |-
            curl -X GET 'https://api.veriko.mx/v1/status/banxico' \
              -H 'Authorization: Bearer veriko_••••'
      responses:
        '200':
          description: Estado actual del servicio de verificación de Banxico.
          x-translations:
            en:
              description: Current Banxico validation service status.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=60
              description: TTL de caché para la vista pública (configurable; default 60 s).
              x-translations:
                en:
                  description: Public-view cache TTL (configurable; defaults to 60 s).
            Vary:
              schema:
                type: string
                example: Origin
              description: Indicador de variación por Origin (CORS).
              x-translations:
                en:
                  description: Origin-based variation marker (CORS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanxicoPublicStatusResponse'
              examples:
                operational:
                  summary: Servicio de verificación de Banxico operativo sin incidentes
                  x-translations:
                    en:
                      summary: Banxico validation service fully operational
                  value:
                    data:
                      type: banxico_status
                      id: current
                      attributes:
                        status: operational
                        status_label: Operativo
                        message: El servicio de verificación está operando normalmente.
                        last_verified_at: '2026-04-11T15:30:00Z'
