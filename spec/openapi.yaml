                en:
                  description: Number of CEPs included in the ZIP archive.
              schema:
                type: integer
                example: 42
            Cache-Control:
              schema:
                type: string
                example: no-cache, no-store, must-revalidate
              description: Deshabilita el almacenamiento en caché por parte de intermediarios durante la descarga.
              x-translations:
                en:
                  description: Disables intermediary caching of the download.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: '`invalid_range`: Fechas mal formadas o `to < from`.'
          x-translations:
            en:
              description: '`invalid_range`: Malformed dates or `to < from`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`no_ceps`: El rango no contiene ningún CEP disponible.'
          x-translations:
            en:
              description: '`no_ceps`: No CEPs available in the specified range.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-translations:
        en:
          summary: Bulk CEP download (ZIP)
          description: |-
            Delivers every available CEP file in a date range as a single ZIP.

            Each validation with a receipt contributes its XML and PDF file (when
            available), all under the `ceps/` directory. The archive carries two
            manifests with the same content in different formats — `manifest.csv`
            and `manifest.xlsx`: Associating each receipt with its validation, date
            and tracking key. They serve to reconcile without opening the receipts
            one by one.

            A range with no receipts responds with an HTTP status `404 no_ceps`.

            Malformed dates, or a `to` earlier than the `from`, respond with an HTTP
            status `400 invalid_range`.

            {% callout type="info" %}
            For a single receipt there is `GET /v1/validations/{id}/cep`, and for
            the month's statement without the files, `GET /v1/finance/statement`.

            {% /callout %}
      security:
        - ApiKeyAuth: []
  /billing/subscription:
    get:
      x-related:
        - GET /v1/usage/summary
        - GET /v1/summary
      tags:
        - Billing
      summary: Consultar suscripción activa del usuario
      description: |-
        Devuelve la suscripción activa del usuario autenticado. La respuesta siempre
        contiene un recurso: si no existe una suscripción activa, el servidor
        asigna el plan predeterminado.

        `source` distingue pagos mediante Stripe (`stripe`), concesiones
        administrativas (`admin_granted`) y planes asignados por el sistema
        (`system_default`). El resumen del ciclo (`used`, `limit`, `remaining` y
        `resets_at`) vive en `meta.quota`.

        El consumo del ciclo también se consulta con
        [`GET /v1/usage/summary`](/es/v1/usage/get-usage-summary). Su `resets_at` es
        el fin del ciclo de cuota: coincide con `current_period_end` salvo en un plan
        anual, donde la cuota se reinicia cada mes y `resets_at` marca el fin del
        mes en curso. Los planes disponibles se consultan con
        [`GET /v1/plans`](/es/v1/plans/list-plans).
      operationId: billingGetSubscription
      x-translations:
        en:
          summary: Get user's active subscription
          description: |-
            Returns the authenticated user's active subscription. The response
            always contains a resource: if no active subscription exists, the
            server assigns the default plan.

            `source` distinguishes Stripe payments (`stripe`), admin grants
            (`admin_granted`), and plans assigned by the system (`system_default`).
            The cycle summary (`used`, `limit`, `remaining`, and `resets_at`) lives
            in `meta.quota`.

            Current-cycle usage is also available from
            [`GET /v1/usage/summary`](/en/v1/usage/get-usage-summary). Its
            `resets_at` is the end of the quota cycle: it matches
            `current_period_end` except on an annual plan, where quota resets every
            month and `resets_at` marks the end of the current month. Available
            plans are returned by [`GET /v1/plans`](/en/v1/plans/list-plans).
      x-codeSamples:
        - lang: curl
          label: Shell
          source: |-
            curl -X GET 'https://api.veriko.mx/v1/billing/subscription' \
              -H 'Authorization: Bearer veriko_••••'
